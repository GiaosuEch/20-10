<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chúc Mừng 20/10 Các Bạn Nữ Lớp 9/12 💐</title>
  <!-- Flower Favicon for Browser Tab (Logo bông hoa trên tab trình duyệt) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='45%25' r='50%25'%3E%3Cstop offset='0%25' stop-color='%23ff75a0' stop-opacity='0.4'/%3E%3Cstop offset='100%25' stop-color='%23ff1464' stop-opacity='0'/%3E%3C/radialGradient%3E%3ClinearGradient id='s' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2355a630'/%3E%3Cstop offset='100%25' stop-color='%231b4332'/%3E%3C/linearGradient%3E%3ClinearGradient id='pL' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ffb8d2'/%3E%3Cstop offset='35%25' stop-color='%23ff3377'/%3E%3Cstop offset='85%25' stop-color='%23c9004f'/%3E%3Cstop offset='100%25' stop-color='%237a0028'/%3E%3C/linearGradient%3E%3ClinearGradient id='pR' x1='1' y1='0' x2='0' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ffccd9'/%3E%3Cstop offset='35%25' stop-color='%23ff4385'/%3E%3Cstop offset='85%25' stop-color='%23d60a59'/%3E%3Cstop offset='100%25' stop-color='%238a0030'/%3E%3C/linearGradient%3E%3ClinearGradient id='pC' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0%25' stop-color='%23fff0f5'/%3E%3Cstop offset='25%25' stop-color='%23ff80ab'/%3E%3Cstop offset='70%25' stop-color='%23f50057'/%3E%3Cstop offset='100%25' stop-color='%23990033'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='30' r='28' fill='url(%23g)'/%3E%3Cpath d='M32 38 Q31 49 32 60' stroke='url(%23s)' stroke-width='4.2' stroke-linecap='round' fill='none'/%3E%3Cpath d='M31 51 C20 48 10 39 12 30 C18 42 24 49 31 51 Z' fill='url(%23s)'/%3E%3Cpath d='M33 53 C44 50 54 41 52 32 C46 44 40 51 33 53 Z' fill='url(%23s)'/%3E%3Cpath d='M21 34 C16 22 22 13 32 9 C42 13 48 22 43 34 C39 42 25 42 21 34 Z' fill='%23660022'/%3E%3Cpath d='M32 40 C19 40 12 28 15 15 C17 10 22 10 26 17 C29 23 31 32 32 40 Z' fill='url(%23pL)'/%3E%3Cpath d='M32 40 C45 40 52 28 49 15 C47 10 42 10 38 17 C35 23 33 32 32 40 Z' fill='url(%23pR)'/%3E%3Cpath d='M24 39 C22 25 24 13 32 10 C40 13 42 25 40 39 C36 43 28 43 24 39 Z' fill='url(%23pC)'/%3E%3Ccircle cx='32' cy='18' r='2.2' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='18' r='1.1' fill='%23ffe57f'/%3E%3C/svg%3E" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040716;
      font-family: 'Quicksand', sans-serif;
      color: #ffffff;
    }

    .font-cursive {
      font-family: 'Dancing Script', cursive;
    }

    /* Glowing Sky Title */
    .glow-title {
      color: #eef8ff;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.95),
        0 0 18px rgba(125, 211, 252, 0.85),
        0 0 36px rgba(56, 189, 248, 0.65);
      animation: titleBreathe 4s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes titleBreathe {
      0%, 100% { transform: translateY(0px); opacity: 1; }
      50% { transform: translateY(-4px); opacity: 0.92; }
    }

    /* Hold Button Ripples — perfectly centered rose-gold aura */
    .hold-ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      margin-top: -35px;
      margin-left: -35px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 182, 193, 0.5);
      box-shadow: 0 0 16px rgba(255, 150, 185, 0.35), inset 0 0 10px rgba(255, 200, 215, 0.18);
      animation: rippleOut 3s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      pointer-events: none;
    }
    .hold-ripple-2 {
      animation-delay: 1.0s;
      border-color: rgba(210, 175, 255, 0.42);
      box-shadow: 0 0 16px rgba(195, 150, 255, 0.28);
    }
    .hold-ripple-3 {
      animation-delay: 2.0s;
      border-color: rgba(175, 220, 255, 0.36);
      box-shadow: 0 0 16px rgba(140, 200, 255, 0.22);
    }

    @keyframes rippleOut {
      0% { transform: scale(1); opacity: 0.88; }
      55% { opacity: 0.32; }
      100% { transform: scale(2.75); opacity: 0; }
    }

    /* Ambient breathing aura behind the orb */
    .button-glow-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      margin-top: -48px;
      margin-left: -48px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 190, 0.38) 0%, rgba(185, 130, 255, 0.2) 46%, rgba(0, 0, 0, 0) 72%);
      filter: blur(10px);
      animation: haloBreathe 3.6s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes haloBreathe {
      0% { transform: scale(0.92); opacity: 0.65; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    /* Dual Orbiting cosmic particles around button */
    .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 104px;
      height: 104px;
      margin-top: -52px;
      margin-left: -52px;
      border-radius: 50%;
      animation: orbitSpin 10s linear infinite;
      pointer-events: none;
    }
    .orbit-ring-rev {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 124px;
      height: 124px;
      margin-top: -62px;
      margin-left: -62px;
      border-radius: 50%;
      animation: orbitSpinRev 14s linear infinite;
      pointer-events: none;
    }
    .orbit-dot {
      position: absolute;
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: rgba(255, 210, 228, 0.9);
      box-shadow: 0 0 8px rgba(255, 180, 210, 0.85);
    }
    .orbit-dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
    .orbit-dot:nth-child(2) { bottom: 0; left: 50%; transform: translateX(-50%); background: rgba(215, 185, 255, 0.85); box-shadow: 0 0 8px rgba(200, 160, 255, 0.8); }
    .orbit-dot:nth-child(3) { top: 50%; right: 0; transform: translateY(-50%); background: rgba(185, 225, 255, 0.85); box-shadow: 0 0 8px rgba(150, 210, 255, 0.8); }
    .orbit-dot:nth-child(4) { top: 50%; left: 0; transform: translateY(-50%); background: rgba(255, 235, 190, 0.85); box-shadow: 0 0 8px rgba(255, 220, 150, 0.75); }

    .orbit-dot-gold {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 238, 175, 0.85);
      box-shadow: 0 0 7px rgba(255, 225, 140, 0.8);
    }
    .orbit-dot-gold:nth-child(1) { top: 18%; left: 18%; }
    .orbit-dot-gold:nth-child(2) { bottom: 18%; right: 18%; }
    .orbit-dot-gold:nth-child(3) { top: 75%; left: 15%; }

    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitSpinRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Glass orb button — exquisite crystal sphere */
    .glass-orb {
      position: relative;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 26%, rgba(255,245,250,0.4) 0%, rgba(255,190,215,0.18) 32%, rgba(150,110,210,0.12) 65%, rgba(20,15,45,0.32) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 220, 235, 0.45);
      box-shadow:
        0 0 28px rgba(255, 145, 185, 0.45),
        0 0 55px rgba(186, 120, 240, 0.22),
        inset 0 2px 3px rgba(255, 255, 255, 0.65),
        inset 0 -2px 6px rgba(110, 50, 130, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      animation: orbPulse 3.2s ease-in-out infinite;
      user-select: none;
      -webkit-user-select: none;
    }
    .glass-orb:hover {
      transform: scale(1.08);
      box-shadow:
        0 0 38px rgba(255, 150, 195, 0.7),
        0 0 75px rgba(195, 135, 255, 0.4),
        inset 0 2px 4px rgba(255, 255, 255, 0.8),
        inset 0 -2px 8px rgba(120, 60, 145, 0.35);
    }
    .glass-orb:active {
      transform: scale(0.92);
      box-shadow:
        0 0 20px rgba(255, 145, 185, 0.55),
        0 0 40px rgba(186, 120, 240, 0.35);
    }
    .glass-orb::before {
      content: '';
      position: absolute;
      top: 7px;
      left: 12px;
      width: 24px;
      height: 13px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.02) 100%);
      transform: rotate(-18deg);
      pointer-events: none;
    }
    .glass-orb::after {
      content: '';
      position: absolute;
      bottom: 9px;
      right: 14px;
      width: 10px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      transform: rotate(-12deg);
      pointer-events: none;
    }

    @keyframes orbPulse {
      0%, 100% {
        box-shadow:
          0 0 28px rgba(255, 145, 185, 0.45),
          0 0 55px rgba(186, 120, 240, 0.22),
          inset 0 2px 3px rgba(255, 255, 255, 0.65),
          inset 0 -2px 6px rgba(110, 50, 130, 0.25);
      }
      50% {
        box-shadow:
          0 0 42px rgba(255, 155, 195, 0.65),
          0 0 85px rgba(195, 135, 255, 0.35),
          inset 0 2px 4px rgba(255, 255, 255, 0.75),
          inset 0 -2px 8px rgba(120, 60, 145, 0.32);
      }
    }

    /* Tulip inside button micro-animation */
    .orb-tulip {
      animation: flowerFloat 3.6s ease-in-out infinite;
      filter: drop-shadow(0 2px 5px rgba(220, 50, 110, 0.35));
      transition: filter 0.25s ease, transform 0.25s ease;
    }
    .glass-orb:hover .orb-tulip {
      filter: drop-shadow(0 0 8px rgba(255, 190, 220, 0.9)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
    }
    @keyframes flowerFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(2deg); }
    }

    /* Prompt text animation */
    .prompt-text {
      animation: textFloat 3.6s ease-in-out infinite;
      letter-spacing: 0.08em;
    }
    @keyframes textFloat {
      0%, 100% { transform: translateY(0); opacity: 0.92; }
      50% { transform: translateY(-3px); opacity: 1; }
    }

    /* Clickable Envelope Card on the Bouquet */
    .envelope-card {
      background: linear-gradient(180deg, #fffdf9 0%, #f5e5cc 100%);
      border: 2px solid #e2c59f;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.58),
        0 0 26px rgba(255, 215, 175, 0.45);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      animation: cardFloat 3s ease-in-out infinite;
    }

    .envelope-card:hover {
      transform: translate(-50%, -52%) scale(1.04) rotate(-1deg) !important;
    }

    .envelope-card:active {
      transform: translate(-50%, -50%) scale(0.97) !important;
    }

    @keyframes cardFloat {
      0%, 100% { filter: drop-shadow(0 10px 20px rgba(0,0,0,0.45)); }
      50% { filter: drop-shadow(0 14px 28px rgba(255,182,193,0.45)); }
    }

    /* Vintage Wavy/Scalloped-Edge Letter Sheet */
    .vintage-letter-modal {
      filter: drop-shadow(0 22px 42px rgba(0, 0, 0, 0.72)) drop-shadow(0 0 24px rgba(255, 220, 185, 0.35));
      transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .vintage-letter-paper {
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.75) 0%, transparent 55%),
        radial-gradient(circle at 82% 85%, rgba(216, 178, 132, 0.38) 0%, transparent 60%),
        linear-gradient(168deg, #fffcf6 0%, #f7e9d3 52%, #ecd6b6 100%);
      color: #463020;
      clip-path: polygon(
        1.5% 2.2%, 5% 0.8%, 9% 2%, 14% 0.7%, 19% 1.9%, 24% 0.6%, 29% 1.8%, 35% 0.6%, 41% 1.8%, 47% 0.5%, 53% 1.8%, 59% 0.6%, 65% 1.9%, 71% 0.7%, 77% 2%, 83% 0.7%, 89% 1.9%, 94% 0.8%, 98.5% 2.2%,
        99.3% 7%, 98.2% 13%, 99.4% 19%, 98.3% 25%, 99.5% 32%, 98.3% 39%, 99.5% 46%, 98.2% 53%, 99.4% 60%, 98.3% 67%, 99.5% 74%, 98.2% 81%, 99.4% 88%, 98.3% 94%, 98.8% 97.8%,
        94% 99.2%, 88% 98.1%, 82% 99.4%, 76% 98.2%, 70% 99.4%, 64% 98.1%, 58% 99.4%, 52% 98.2%, 46% 99.5%, 40% 98.1%, 34% 99.4%, 28% 98.2%, 22% 99.3%, 16% 98.1%, 10% 99.2%, 5% 98.1%, 1.2% 97.8%,
        0.6% 92%, 1.8% 85%, 0.5% 78%, 1.7% 71%, 0.5% 64%, 1.7% 57%, 0.5% 50%, 1.7% 43%, 0.5% 36%, 1.7% 29%, 0.5% 22%, 1.7% 15%, 0.6% 8%
      );
      box-shadow: inset 0 0 38px rgba(176, 132, 85, 0.35);
    }

    .letter-scroll::-webkit-scrollbar { width: 4px; }
    .letter-scroll::-webkit-scrollbar-thumb { background: rgba(180, 135, 90, 0.45); border-radius: 9999px; }
    /* Keep the original layout; refine only light and physical materials. */
    .glow-title {
      text-shadow: 0 2px 3px rgba(0,0,0,.3), 0 0 16px rgba(181,220,255,.45), 0 0 38px rgba(88,155,220,.22);
    }
    .envelope-card {
      background: repeating-linear-gradient(8deg,transparent 0 3px,rgba(141,103,69,.025) 3px 4px),linear-gradient(145deg,#fffcf4,#f3e0c7);
      border: 1px solid #d6b995;
      box-shadow: inset 0 1px 1px #fff, inset 0 -2px 3px #c7a47a55, 2px 12px 23px #0006;
    }
    .envelope-card > .absolute, .vintage-letter-modal > .absolute {
      background: radial-gradient(circle at 32% 25%,#ed8197,#b33959 60%,#74223e);
      border-color: #d27d8e;
      box-shadow: inset 1px 2px 3px #ffbdc566,inset -2px -2px 3px #59132977,2px 3px 5px #0005;
    }
    .vintage-letter-paper {
      background: repeating-linear-gradient(12deg,transparent 0 3px,rgba(136,92,47,.025) 3px 4px),radial-gradient(ellipse at 12% 0,#fffef9,transparent 70%),linear-gradient(135deg,#fff6e5,#f0ddbf);
    }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden select-none">

  <!-- 1. BACKGROUND CANVAS (Night Sky, Stars, Hills, Bouquet & Fireflies) -->
  <canvas id="sceneCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

  <!-- 2. GLOWING SKY TITLE -->
  <div id="skyTitle" class="fixed top-9 sm:top-11 left-0 right-0 z-10 text-center px-4 pointer-events-none opacity-0 transition-all duration-1000 transform translate-y-2">
    <h1 class="font-cursive text-[30px] sm:text-5xl glow-title leading-tight">
      Chúc mừng ngày phụ nữ Việt Nam
    </h1>
    <p class="font-cursive text-3xl sm:text-5xl glow-title -mt-0.5">
      20/10
    </p>
  </div>

  <!-- 3. INITIAL GIFT BUTTON -->
  <div id="holdStage" class="fixed inset-x-0 bottom-10 sm:bottom-14 z-40 flex flex-col items-center justify-center transition-all duration-700">
    <div class="flex items-center gap-2 mb-4 cursor-default select-none">
      <span class="text-rose-300 text-xs sm:text-sm animate-pulse opacity-80">✦</span>
      <p class="prompt-text font-cursive text-[17px] sm:text-xl text-pink-100 font-medium tracking-wide" style="text-shadow: 0 0 14px rgba(255,180,205,0.7), 0 0 28px rgba(185,140,255,0.4), 0 1px 3px rgba(0,0,0,0.5);">
        Chạm để mở quà
      </p>
      <span class="text-rose-300 text-xs sm:text-sm animate-pulse opacity-80" style="animation-delay: 0.5s;">✦</span>
    </div>

    <div class="relative flex items-center justify-center" style="width: 140px; height: 140px;">
      <!-- Ambient Floor Reflection / Ground Glow -->
      <div class="absolute -bottom-2 w-20 h-4 rounded-full bg-pink-500/20 blur-md pointer-events-none"></div>

      <!-- Breathing Aura Halo -->
      <div class="button-glow-halo"></div>

      <!-- Concentric Ripples -->
      <div class="hold-ripple"></div>
      <div class="hold-ripple hold-ripple-2"></div>
      <div class="hold-ripple hold-ripple-3"></div>

      <!-- Dual Cosmic Orbiting particles -->
      <div class="orbit-ring">
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
      </div>
      <div class="orbit-ring-rev">
        <div class="orbit-dot-gold"></div>
        <div class="orbit-dot-gold"></div>
        <div class="orbit-dot-gold"></div>
      </div>

      <!-- Progress Ring SVG -->
      <svg class="absolute pointer-events-none" style="top: 50%; left: 50%; width: 92px; height: 92px; margin-top: -46px; margin-left: -46px;" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb8d0" />
            <stop offset="50%" stop-color="#d4a5ff" />
            <stop offset="100%" stop-color="#9cd6ff" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,200,225,0.14)" stroke-width="3" />
        <circle id="holdRing" cx="50" cy="50" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"
          style="filter: drop-shadow(0 0 7px rgba(255,180,210,0.65)); transform: rotate(-90deg); transform-origin: center;" />
      </svg>

      <!-- Glass Orb Button -->
      <button id="btnHold" class="glass-orb z-10 focus:outline-none" aria-label="Chạm để mở quà">
        <svg class="orb-tulip" width="30" height="30" viewBox="0 0 32 32" fill="none">
          <!-- Tulip flower SVG -->
          <path d="M16 28 L16 14" stroke="url(#stemG)" stroke-width="2.2" stroke-linecap="round"/>
          <!-- Left leaf -->
          <path d="M16 22 Q10 19 9 23 Q10 26 16 24" fill="#4a9e5e" opacity="0.85"/>
          <!-- Right leaf -->
          <path d="M16 20 Q22 17 23 21 Q22 24 16 22" fill="#3d8a50" opacity="0.85"/>
          <!-- Left petal -->
          <path d="M16 14 Q10 12 8 6 Q10 2 14 5 Q15 8 16 14" fill="url(#petalL)"/>
          <!-- Right petal -->
          <path d="M16 14 Q22 12 24 6 Q22 2 18 5 Q17 8 16 14" fill="url(#petalR)"/>
          <!-- Center petal -->
          <path d="M16 14 Q13 10 13 5 Q16 1 19 5 Q19 10 16 14" fill="url(#petalC)"/>
          <defs>
            <linearGradient id="stemG" x1="16" y1="28" x2="16" y2="14">
              <stop offset="0%" stop-color="#2d7a3e"/>
              <stop offset="100%" stop-color="#60c074"/>
            </linearGradient>
            <linearGradient id="petalL" x1="8" y1="12" x2="14" y2="3">
              <stop offset="0%" stop-color="#e8457a"/>
              <stop offset="100%" stop-color="#ffb8cc"/>
            </linearGradient>
            <linearGradient id="petalR" x1="24" y1="12" x2="18" y2="3">
              <stop offset="0%" stop-color="#d63b6e"/>
              <stop offset="100%" stop-color="#ffa0bb"/>
            </linearGradient>
            <linearGradient id="petalC" x1="16" y1="14" x2="16" y2="1">
              <stop offset="0%" stop-color="#ff6b9d"/>
              <stop offset="40%" stop-color="#ff8cb5"/>
              <stop offset="100%" stop-color="#ffe0ec"/>
            </linearGradient>
          </defs>
        </svg>
      </button>
    </div>
  </div>

  <!-- 4. CLICKABLE ENVELOPE CARD ON THE BOUQUET -->
  <div id="envelopeCard"
    role="button"
    tabindex="0"
    aria-label="Mở thư chúc mừng 20/10"
    class="envelope-card fixed z-[150] opacity-0 pointer-events-none w-[275px] sm:w-[330px] rounded-2xl px-5 py-3.5 text-center cursor-pointer"
    style="top: 56%; left: 50%; transform: translate(-50%, -50%) scale(0.65) rotate(-1.5deg);">

    <!-- Red Heart Seal Badge -->
    <div class="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-md border-2 border-white animate-bounce pointer-events-none">
      <span class="text-xs">❤</span>
    </div>

    <div class="border-b border-dashed border-[#d4b288] pb-1.5 mb-1.5 pointer-events-none">

  <script>
    /*************************************************************************
     * 1. 20/10 LETTER CONTENT FOR CLASS 9/12
     *************************************************************************/
    const letterTitleHTML = 'Gửi các bạn nữ <span class="text-rose-500">9/12</span> xinh đẹp!';
    const letterParagraphs = [
      "Nhân ngày Phụ nữ Việt Nam 20/10, chúc một nửa thế giới của tập thể 9/12 luôn rạng rỡ như những đóa hoa Tulip dưới bầu trời đêm đầy sao.",
      "Cảm ơn các bạn vì đã luôn mang đến tiếng cười, sự dịu dàng và nguồn năng lượng tích cực, làm cho mỗi ngày đến lớp đều trở nên thật ý nghĩa.",
      "Chúc các bạn nữ 9/12 luôn tự tin với nét riêng của mình, được yêu thương và trân trọng, can đảm theo đuổi những điều mình mơ ước. Mỗi bạn là một đóa hoa riêng, làm nên những kỷ niệm thật đẹp của 9/12!"
    ];

    /*************************************************************************
     * 2. AUDIO SYNTHESIZER
     *************************************************************************/
    let audioCtx = null;
    let isMusicPlaying = false;
    let isSoundMuted = false;
    let melodyTimer = null;
    let noteIndex = 0;

    const ROMANTIC_MELODY = [
      { m: 523.25, c: [261.63, 329.63, 392.00] },
      { m: 659.25, c: [261.63, 329.63] },
      { m: 783.99, c: [246.94, 392.00] },
      { m: 659.25, c: [329.63] },
      { m: 698.46, c: [220.00, 349.23, 440.00] },
      { m: 659.25, c: [220.00, 329.63] },
      { m: 587.33, c: [293.66, 349.23] },
      { m: 523.25, c: [196.00, 293.66, 392.00] },
      { m: 587.33, c: [196.00, 246.94] },
      { m: 659.25, c: [261.63, 329.63, 392.00] },
      { m: 523.25, c: [261.63, 329.63] }
    ];

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound(e) {
      if (e) e.stopPropagation();
      ensureAudio();
      isSoundMuted = !isSoundMuted;
      const soundIconOn = document.getElementById('soundIconOn');
      const soundIconOff = document.getElementById('soundIconOff');
      if (isSoundMuted) {
        if (soundIconOn) soundIconOn.classList.add('hidden');
        if (soundIconOff) soundIconOff.classList.remove('hidden');
      } else {
        if (soundIconOff) soundIconOff.classList.add('hidden');
        if (soundIconOn) soundIconOn.classList.remove('hidden');
        if (!isMusicPlaying) startMusic();
      }
    }

    function playPianoNote(freq, dur = 1.6, vol = 0.055) {
      if (!audioCtx || !isMusicPlaying || isSoundMuted) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0008, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0005, now + dur);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    function playSparkleChime() {
      if (isSoundMuted) return;
      ensureAudio();
      if (!audioCtx) return;
      const notes = [587.33, 783.99, 987.77, 1174.66, 1567.98];
      notes.forEach((f, i) => {
        setTimeout(() => {
          if (isSoundMuted || !audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.045, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0006, now + 0.65);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.65);
        }, i * 65);
      });
    }

    function startMusic() {
      ensureAudio();
      if (isMusicPlaying) return;
      isMusicPlaying = true;
      melodyTimer = setInterval(() => {
        if (!isMusicPlaying || isSoundMuted) return;
        const step = ROMANTIC_MELODY[noteIndex % ROMANTIC_MELODY.length];
        playPianoNote(step.m, 1.85, 0.06);
        step.c.forEach((cf, idx) => {
          setTimeout(() => playPianoNote(cf, 2.1, 0.03), idx * 90);
        });
        noteIndex++;
      }, 670);
    }

    /*************************************************************************
     * 3. NIGHT SKY & BOUQUET ENGINE
     *************************************************************************/
    const canvas = document.getElementById('sceneCanvas');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;

    let appState = 'HOLD';
    let growStartTime = 0;

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - clamp01(t), 3); }
    function easeOutBack(t) {
      t = clamp01(t);
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    const stars = [];
    const shootingStars = [];
    const grassBlades = [];
    const fireflies = [];
    const sparkles = [];
    const clouds = [];
    const petals = [];
    const wildflowers = [];
    const lanterns = [];
    const auroraWaves = [];
    const waterLanterns = [];
    const lunarMoths = [];

    // Interactive Fairy Dust (Bụi tiên tương tác - Throttled for smooth 60fps)
    let lastDustTime = 0;
    function spawnFairyDust(x, y) {
      const now = performance.now();
      if (now - lastDustTime < 28) return;
      lastDustTime = now;
      if (sparkles.length > 50) return;
      if (Math.random() < 0.45) {
        const colors = ['#ffe6a7', '#ffb8d1', '#c5a0ff', '#a6e3ff', '#ffffff'];
        sparkles.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 0.6,
          vy: Math.random() * 0.4 + 0.25,
          r: Math.random() * 1.6 + 0.6,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 0.9,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    // Mouse & Touch Parallax + Fairy Dust
    let mouseX = 0.5, mouseY = 0.5;
    let targetMX = 0.5, targetMY = 0.5;
    document.addEventListener('mousemove', e => {
      targetMX = e.clientX / window.innerWidth;
      targetMY = e.clientY / window.innerHeight;
      spawnFairyDust(e.clientX, e.clientY);
    });
    document.addEventListener('touchmove', e => {
      if (e.touches && e.touches.length > 0) {
        targetMX = e.touches[0].clientX / window.innerWidth;
        targetMY = e.touches[0].clientY / window.innerHeight;
        spawnFairyDust(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
    // Gyroscope for mobile devices
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', e => {
        if (e.gamma !== null) targetMX = 0.5 + (e.gamma / 45) * 0.3;
        if (e.beta !== null) targetMY = 0.5 + ((e.beta - 45) / 45) * 0.3;
        targetMX = Math.max(0, Math.min(1, targetMX));
        targetMY = Math.max(0, Math.min(1, targetMY));
      });
    }

    const TULIP_DEFS = [
      { id: 0, tx: -34, ty: -236, bx: -6,  angle: -0.09, scale: 0.98, stemStart: 0.08, bloomStart: 0.80, layer: 1, phase: 0.4 },
      { id: 1, tx:  34, ty: -236, bx:  6,  angle:  0.09, scale: 0.98, stemStart: 0.14, bloomStart: 0.86, layer: 1, phase: 1.7 },
      { id: 2, tx:   0, ty: -202, bx:  0,  angle:  0.00, scale: 1.04, stemStart: 0.02, bloomStart: 0.75, layer: 2, phase: 1.1 },
      { id: 3, tx: -90, ty: -214, bx: -15, angle: -0.25, scale: 0.93, stemStart: 1.35, bloomStart: 1.68, layer: 0, phase: 2.8 },
      { id: 4, tx:  90, ty: -214, bx:  15, angle:  0.25, scale: 0.93, stemStart: 1.40, bloomStart: 1.73, layer: 0, phase: 4.1 },
      { id: 5, tx:   0, ty: -252, bx:   0, angle:  0.00, scale: 0.92, stemStart: 1.38, bloomStart: 1.70, layer: 0, phase: 5.4 },
      { id: 6, tx: -60, ty: -184, bx: -11, angle: -0.17, scale: 0.99, stemStart: 1.44, bloomStart: 1.76, layer: 2, phase: 3.3 },
      { id: 7, tx:  60, ty: -184, bx:  11, angle:  0.17, scale: 0.99, stemStart: 1.48, bloomStart: 1.80, layer: 2, phase: 5.0 },
      { id: 8, tx: -106, ty: -156, bx: -19, angle: -0.34, scale: 0.95, stemStart: 1.54, bloomStart: 1.86, layer: 3, phase: 0.9 },
      { id: 9, tx:  106, ty: -156, bx:  19, angle:  0.34, scale: 0.95, stemStart: 1.58, bloomStart: 1.90, layer: 3, phase: 2.2 },
      { id: 10, tx:   0, ty: -148, bx:   0, angle:  0.00, scale: 1.06, stemStart: 1.62, bloomStart: 1.94, layer: 3, phase: 3.9 }
    ];

    const LEAF_DEFS = [
      { tx:  -64, ty: -242, cx: -48, cy: -140, w: 20, delay: 0.25, phase: 1.4, back: true },
      { tx:   64, ty: -242, cx:  48, cy: -140, w: 20, delay: 0.30, phase: 3.2, back: true },
      { tx:    0, ty: -258, cx:   5, cy: -150, w: 19, delay: 0.20, phase: 4.0, back: true },
      { tx: -116, ty: -196, cx: -84, cy: -112, w: 22, delay: 1.42, phase: 0.5, back: true },
      { tx:  116, ty: -196, cx:  84, cy: -112, w: 22, delay: 1.46, phase: 2.1, back: true },
      { tx:  -84, ty: -142, cx: -60, cy:  -95, w: 18, delay: 1.52, phase: 2.7, back: false },
      { tx:   84, ty: -142, cx:  60, cy:  -95, w: 18, delay: 1.56, phase: 0.8, back: false },
      { tx:  -36, ty: -136, cx: -24, cy:  -90, w: 16, delay: 0.45, phase: 4.5, back: false },
      { tx:   36, ty: -136, cx:  24, cy:  -90, w: 16, delay: 0.50, phase: 1.9, back: false }
    ];

    let cachedSkyGrad = null;
    let cachedRoseTint = null;
    let cachedHorizGlow = null;
    let cachedHill1Grad = null;
    let cachedLakeGrad = null;
    let cachedMoonColGrad = null;
    let cachedMoundGrad = null;
    let cachedGrassG1 = null;
    let cachedGrassG2 = null;
    let cachedKraftBackGrad = null;
    let cachedKraftSkirtGrad = null;
    let cachedKraftLeftGrad = null;
    let cachedKraftRightGrad = null;
    let cachedRibGrad = null;

    function initScene() {
      W = window.innerWidth;
      H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, W > 1024 ? 1.0 : 1.25);
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Reset cached bouquet gradients on resize
      cachedKraftBackGrad = null;
      cachedKraftSkirtGrad = null;
      cachedKraftLeftGrad = null;
      cachedKraftRightGrad = null;
      cachedRibGrad = null;

      // Cached static landscape gradients (eliminates thousands of per-frame GC allocations)
      cachedSkyGrad = ctx.createLinearGradient(0, 0, 0, H);
      cachedSkyGrad.addColorStop(0, '#02040c');
      cachedSkyGrad.addColorStop(0.35, '#070f26');
      cachedSkyGrad.addColorStop(0.72, '#0c1a3a');
      cachedSkyGrad.addColorStop(1, '#081226');

      cachedRoseTint = ctx.createRadialGradient(W*0.5, H*0.62, 20, W*0.5, H*0.62, W*0.65);
      cachedRoseTint.addColorStop(0, 'rgba(80,20,45,0.04)');
      cachedRoseTint.addColorStop(0.5, 'rgba(50,10,30,0.02)');
      cachedRoseTint.addColorStop(1, 'rgba(0,0,0,0)');

      cachedHorizGlow = ctx.createLinearGradient(0, H*0.6, 0, H*0.78);
      cachedHorizGlow.addColorStop(0, 'rgba(0,0,0,0)');
      cachedHorizGlow.addColorStop(0.5, 'rgba(35,18,45,0.06)');
      cachedHorizGlow.addColorStop(1, 'rgba(60,25,40,0.04)');

      const horizonY = H * 0.72;
      cachedHill1Grad = ctx.createLinearGradient(0, horizonY - 50, 0, horizonY + 30);
      cachedHill1Grad.addColorStop(0, '#0c2650');
      cachedHill1Grad.addColorStop(0.6, '#0a224a');
      cachedHill1Grad.addColorStop(1, '#081d3e');

      const lakeTopY = horizonY + 10;
      const lakeBottomY = H - 55;
      cachedLakeGrad = ctx.createLinearGradient(0, lakeTopY, 0, lakeBottomY);
      cachedLakeGrad.addColorStop(0, '#041026');
      cachedLakeGrad.addColorStop(0.28, '#06173a');
      cachedLakeGrad.addColorStop(0.65, '#071f45');
      cachedLakeGrad.addColorStop(1, '#05142b');

      cachedMoonColGrad = ctx.createRadialGradient(W * 0.17, lakeTopY + 45, 10, W * 0.17, lakeTopY + 45, Math.max(W * 0.35, 240));
      cachedMoonColGrad.addColorStop(0, 'rgba(215, 235, 255, 0.18)');
      cachedMoonColGrad.addColorStop(0.25, 'rgba(165, 205, 245, 0.09)');
      cachedMoonColGrad.addColorStop(0.65, 'rgba(110, 160, 220, 0.025)');
      cachedMoonColGrad.addColorStop(1, 'rgba(10, 25, 60, 0)');

      cachedMoundGrad = ctx.createLinearGradient(0, H - 140, 0, H);
      cachedMoundGrad.addColorStop(0, '#0c2e28');
      cachedMoundGrad.addColorStop(0.4, '#071e1a');
      cachedMoundGrad.addColorStop(0.7, '#041210');
      cachedMoundGrad.addColorStop(1, '#020a0c');

      cachedGrassG1 = ctx.createLinearGradient(0, H, 0, H - 95);
      cachedGrassG1.addColorStop(0, '#041212');
      cachedGrassG1.addColorStop(0.65, '#174736');
      cachedGrassG1.addColorStop(1, '#39855d');

      cachedGrassG2 = ctx.createLinearGradient(0, H, 0, H - 115);
      cachedGrassG2.addColorStop(0, '#061a18');
      cachedGrassG2.addColorStop(0.6, '#236647');
      cachedGrassG2.addColorStop(1, '#6cc482');

      stars.length = 0;
      const starCount = Math.min(110, Math.floor((W * H) / 7500));
      for (let i = 0; i < starCount; i++) {
        const isBright = Math.random() < 0.12;
        stars.push({
          x: Math.random() * W,
          y: Math.random() * (H * 0.72),
          r: isBright ? (Math.random() * 1.5 + 1.0) : (Math.random() * 1.0 + 0.3),
          alpha: isBright ? (Math.random() * 0.3 + 0.7) : (Math.random() * 0.55 + 0.18),
          speed: Math.random() * 0.0028 + 0.0008,
          phase: Math.random() * Math.PI * 2,
          isBright,
          hue: isBright ? (Math.random() < 0.5 ? 42 : 220) : 210
        });
      }

      // Wispy clouds
      clouds.length = 0;
      for (let i = 0; i < 3; i++) {
        clouds.push({
          x: Math.random() * W * 1.5 - W * 0.25,
          y: H * 0.06 + Math.random() * H * 0.22,
          w: Math.random() * 240 + 160,
          h: Math.random() * 26 + 14,
          speed: (Math.random() * 0.10 + 0.04) * (Math.random() < 0.5 ? 1 : -1),
          alpha: Math.random() * 0.06 + 0.025
        });
      }

      grassBlades.length = 0;
      const bladeCount = Math.min(130, Math.floor(W / 5.5));
      for (let i = 0; i < bladeCount; i++) {
        const normX = i / bladeCount;
        const x = normX * (W + 80) - 40 + (Math.random() * 6 - 3);
        const arch = Math.sin(normX * Math.PI);
        const h = (Math.random() * 76 + 52) * (0.65 + 0.45 * arch);
        grassBlades.push({
          x,
          h,
          w: Math.random() * 2.3 + 1.3,
          curve: (Math.random() - 0.5) * 38,
          speed: Math.random() * 0.0018 + 0.0011,
          phase: Math.random() * Math.PI * 2,
          layer: i % 3
        });
      }

      fireflies.length = 0;
      for (let i = 0; i < 14; i++) {
        fireflies.push({
          x: Math.random() * W,
          y: H - Math.random() * 260,
          vx: (Math.random() - 0.5) * 0.32,
          vy: -(Math.random() * 0.38 + 0.15),
          r: Math.random() * 1.8 + 1.0,
          isGold: Math.random() > 0.35,
          phase: Math.random() * Math.PI * 2,
          trail: []
        });
      }

      // Falling rose petals
      petals.length = 0;
      for (let i = 0; i < 10; i++) {
        petals.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.7 - H * 0.1,
          vx: (Math.random() - 0.5) * 0.28,
          vy: Math.random() * 0.35 + 0.12,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.015,
          size: Math.random() * 4.0 + 2.5,
          wobblePhase: Math.random() * Math.PI * 2,
          wobbleSpeed: Math.random() * 0.002 + 0.001,
          alpha: Math.random() * 0.35 + 0.15,
          color: Math.random() < 0.6 ? 0 : (Math.random() < 0.5 ? 1 : 2) // 0=pink 1=rose 2=blush
        });
      }

      // Wildflowers on the ground
      wildflowers.length = 0;
      const flowerCount = Math.min(12, Math.floor(W / 36));
      for (let i = 0; i < flowerCount; i++) {
        const normX = (i + 0.5) / flowerCount;
        wildflowers.push({
          x: normX * W + (Math.random() - 0.5) * 30,
          petalCount: Math.floor(Math.random() * 2) + 5,
          size: Math.random() * 3.0 + 1.8,
          stemH: Math.random() * 18 + 8,
          color: Math.random() < 0.4 ? '#ffb8d0' : (Math.random() < 0.5 ? '#c5a0ff' : '#ffe0a0'),

        { bx: side * 10 * g + sway * 0.5, by: -50 * g, rot: side * 0.5, sc: 0.76, d: 0.5 }
      ];

      bells.forEach(b => {
        const bp = clamp01((growProg - b.d) / (1 - b.d));
        if (bp <= 0) return;
        const bs = b.sc * easeOutBack(bp);
        ctx.save();
        ctx.translate(b.bx, b.by);
        ctx.rotate(b.rot + Math.sin(time * 0.004) * 0.08);
        ctx.scale(bs, bs);

        ctx.fillStyle = '#f2f6ee';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-7, 2, -8, 10, -3, 14);
        ctx.quadraticCurveTo(0, 11, 3, 14);
        ctx.bezierCurveTo(8, 10, 7, 2, 0, 0);
        ctx.fill();
        ctx.restore();
      });

      ctx.restore();
    }

    const kraftTexture = (() => {
      const tile=document.createElement('canvas');tile.width=tile.height=96;
      const brush=tile.getContext('2d');let seed=2010;
      const random=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
      for(let i=0;i<1100;i++) {
        brush.fillStyle=i%3?'rgba(84,53,25,.13)':'rgba(255,248,223,.4)';
        brush.fillRect(random()*96,random()*96,random()*1.3+.2,random()*2+.3);
      }
      return ctx.createPattern(tile,'repeat');
    })();

    function finishPaper(ctx) {
      ctx.save();ctx.clip();ctx.fillStyle=kraftTexture;
      ctx.fillRect(-160,-280,320,370);ctx.restore();
    }

    function drawBouquet(ctx, time, elapsed) {
      const bScale = Math.min(1.08, Math.max(0.76, Math.min(W / 430, H / 720)));
      const centerX = W * 0.5;
      const baseTieY = H - 102 * bScale;
      const globalSway = Math.sin(time * 0.0011) * 2;

      // === SOFT AMBIENT OCCLUSION / GROUND CAST SHADOW ===
      const growProg = easeOutCubic(elapsed / 1.1);
      if (growProg > 0) {
        ctx.save();
        ctx.translate(centerX, baseTieY + 68 * bScale);

        ctx.beginPath();
        ctx.ellipse(0, 0, 88 * bScale, 22 * bScale, 0, 0, Math.PI * 2);
