        ctx.beginPath();
        ctx.ellipse(0, -3 * bScale, 38 * bScale, 9 * bScale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.translate(centerX, baseTieY);
      ctx.scale(bScale, bScale);

      const frostedWrapProg = easeOutCubic((elapsed - 0.8) / 0.85);
      const kraftWrapProg = easeOutBack((elapsed - 1.95) / 0.85);
      const kraftAlpha = clamp01((elapsed - 1.95) / 0.6);

      if (kraftAlpha > 0) {
        if (!cachedKraftBackGrad) {
          cachedKraftBackGrad = ctx.createLinearGradient(0, -275, 0, 0);
          cachedKraftBackGrad.addColorStop(0, '#f3d9b1');
          cachedKraftBackGrad.addColorStop(0.55, '#d6b080');
          cachedKraftBackGrad.addColorStop(1, '#9c7345');

          cachedKraftSkirtGrad = ctx.createLinearGradient(-65, 0, 65, 55);
          cachedKraftSkirtGrad.addColorStop(0, '#f5dec0');
          cachedKraftSkirtGrad.addColorStop(0.5, '#dfba8c');
          cachedKraftSkirtGrad.addColorStop(1, '#b58956');

          cachedKraftLeftGrad = ctx.createLinearGradient(-135, -145, 20, 5);
          cachedKraftLeftGrad.addColorStop(0, '#fff0d9');
          cachedKraftLeftGrad.addColorStop(0.22, '#e9ccaa');
          cachedKraftLeftGrad.addColorStop(0.48, '#f1d5b3');
          cachedKraftLeftGrad.addColorStop(0.7, '#c49b70');
          cachedKraftLeftGrad.addColorStop(1, '#96704e');

          cachedKraftRightGrad = ctx.createLinearGradient(135, -145, -20, 5);
          cachedKraftRightGrad.addColorStop(0, '#f3ddc1');
          cachedKraftRightGrad.addColorStop(0.26, '#dfbd95');
          cachedKraftRightGrad.addColorStop(0.46, '#eacba5');
          cachedKraftRightGrad.addColorStop(0.73, '#ba916a');
          cachedKraftRightGrad.addColorStop(1, '#8e6545');

          cachedRibGrad = ctx.createLinearGradient(-45, -15, 45, 25);
          cachedRibGrad.addColorStop(0, '#86425d');
          cachedRibGrad.addColorStop(.16, '#cb7898');
          cachedRibGrad.addColorStop(.32, '#fbe0e5');
          cachedRibGrad.addColorStop(.43, '#eab3c4');
          cachedRibGrad.addColorStop(.56, '#b96385');
          cachedRibGrad.addColorStop(.74, '#efbfd0');
          cachedRibGrad.addColorStop(1, '#91445f');
        }

        ctx.save();
        ctx.globalAlpha = kraftAlpha;
        const kw = 0.82 + 0.18 * kraftWrapProg;
        ctx.scale(kw, kw);

        ctx.fillStyle = cachedKraftBackGrad;
        ctx.beginPath();
        ctx.moveTo(-42, 0);
        ctx.lineTo(-148, -155);
        ctx.lineTo(-92, -238);
        ctx.lineTo(-62, -218);
        ctx.lineTo(-28, -266);
        ctx.lineTo(0, -235);
        ctx.lineTo(28, -266);
        ctx.lineTo(62, -218);
        ctx.lineTo(92, -238);
        ctx.lineTo(148, -155);
        ctx.lineTo(42, 0);
        ctx.closePath();
        ctx.fill();
        finishPaper(ctx);

        ctx.fillStyle = 'rgba(26, 42, 30, 0.72)';
        ctx.beginPath();
        ctx.moveTo(-36, 0);
        ctx.lineTo(-122, -150);
        ctx.lineTo(-25, -225);
        ctx.lineTo(25, -225);
        ctx.lineTo(122, -150);
        ctx.lineTo(36, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      if (frostedWrapProg > 0) {
        ctx.save();
        ctx.globalAlpha = clamp01(frostedWrapProg) * 0.45;
        const fw = 0.75 + 0.25 * frostedWrapProg;
        ctx.scale(fw, fw);
        ctx.fillStyle = 'rgba(230, 244, 255, 0.78)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-34, 0);
        ctx.lineTo(-126, -152);
        ctx.lineTo(-74, -226);
        ctx.lineTo(-18, -205);
        ctx.lineTo(0, -242);
        ctx.lineTo(18, -205);
        ctx.lineTo(74, -226);
        ctx.lineTo(126, -152);
        ctx.lineTo(34, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      const stemBaseProg = easeOutCubic(elapsed / 0.8);
      if (stemBaseProg > 0) {
        ctx.save();
        ctx.strokeStyle = '#2d6d39';
        ctx.lineWidth = 5.5;
        ctx.lineCap = 'round';
        for (let i = -4; i <= 4; i++) {
          const sx = i * 5.2;
          const botX = i * 7.8 + globalSway * 0.25;
          const botY = 76 * stemBaseProg;
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.lineTo(botX, botY);
          ctx.stroke();
        }
        ctx.restore();
      }

      LEAF_DEFS.filter(l => l.back).forEach(leaf => {
        drawTulipLeaf(ctx, 0, -10, leaf, elapsed, time);
      });

      const activeTulips = [];
      TULIP_DEFS.forEach(tDef => {
        const stemGrow = clamp01((elapsed - tDef.stemStart) / 0.78);
        if (stemGrow <= 0) return;

        const g = easeOutCubic(stemGrow);
        const indSway = Math.sin(time * 0.0015 + tDef.phase) * 2.8 * g + globalSway * g;

        const startX = tDef.bx;
        const startY = 0;
        const endX = tDef.tx * g + indSway;
        const endY = tDef.ty * g;
        const ctrlX = (startX + endX) * 0.45;
        const ctrlY = endY * 0.55;

        ctx.strokeStyle = '#4e7b44';
        ctx.lineWidth = 5.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
        ctx.stroke();
        ctx.save();ctx.translate(-1,0);ctx.lineWidth=1;
        ctx.strokeStyle='rgba(206,226,156,.35)';ctx.stroke();ctx.restore();

        const dx = endX - ctrlX;
        const dy = endY - ctrlY;
        const tipAngle = Math.atan2(dx, -dy) * 0.65 + tDef.angle * 0.35;
        const bloomProg = clamp01((elapsed - tDef.bloomStart) / 0.75);

        activeTulips.push({
          def: tDef,
          x: endX,
          y: endY,
          angle: tipAngle,
          bloom: bloomProg
        });
      });

      LEAF_DEFS.filter(l => !l.back).forEach(leaf => {
        drawTulipLeaf(ctx, 0, -5, leaf, elapsed, time);
      });

      activeTulips.sort((a, b) => a.def.layer - b.def.layer);
      activeTulips.forEach(item => {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.angle);
        drawTulipBlossom(ctx, item.bloom, time + item.def.phase * 400, item.def.scale, item.def.id);
        ctx.restore();
      });

      if (kraftAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = kraftAlpha;
        const kw = 0.84 + 0.16 * kraftWrapProg;
        ctx.scale(kw, kw);

        ctx.fillStyle = cachedKraftSkirtGrad;
        ctx.beginPath();
        ctx.moveTo(-36, -2);
        ctx.lineTo(-62, 48);
        ctx.lineTo(-18, 38);
        ctx.lineTo(0, 52);
        ctx.lineTo(22, 38);
        ctx.lineTo(62, 48);
        ctx.lineTo(36, -2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#cfa472';
        ctx.beginPath();
        ctx.moveTo(-144, -152);
        ctx.lineTo(-96, -125);
        ctx.lineTo(-38, 2);
        ctx.lineTo(-56, 26);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#c49764';
        ctx.beginPath();
        ctx.moveTo(144, -152);
        ctx.lineTo(96, -125);
        ctx.lineTo(38, 2);
        ctx.lineTo(56, 26);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        // Crisp zero-blur contact shadow
        ctx.fillStyle = 'rgba(12, 6, 2, 0.18)';
        ctx.beginPath();
        ctx.moveTo(-133, -144); ctx.lineTo(17, -68); ctx.lineTo(37, 5); ctx.lineTo(-33, 5); ctx.lineTo(-89, -74);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = cachedKraftLeftGrad;
        ctx.beginPath();
        ctx.moveTo(-136, -148);
        ctx.lineTo(14, -72);
        ctx.lineTo(34, 2);
        ctx.lineTo(-36, 2);
        ctx.lineTo(-92, -78);
        ctx.closePath();
        ctx.fill();
        finishPaper(ctx);
        ctx.strokeStyle='rgba(255,245,217,.48)';ctx.lineWidth=.9;
        ctx.beginPath();ctx.moveTo(-136,-148);ctx.lineTo(14,-72);ctx.lineTo(34,2);ctx.stroke();
        ctx.restore();

        ctx.save();
        // Crisp zero-blur contact shadow
        ctx.fillStyle = 'rgba(12, 6, 2, 0.22)';
        ctx.beginPath();
        ctx.moveTo(133, -144); ctx.lineTo(-17, -68); ctx.lineTo(-37, 5); ctx.lineTo(33, 5); ctx.lineTo(89, -74);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = cachedKraftRightGrad;
        ctx.beginPath();
        ctx.moveTo(136, -148);
        ctx.lineTo(-14, -72);
        ctx.lineTo(-34, 2);
        ctx.lineTo(36, 2);
        ctx.lineTo(92, -78);
        ctx.closePath();
        ctx.fill();
        finishPaper(ctx);
        ctx.strokeStyle='rgba(255,240,208,.45)';ctx.lineWidth=.9;
        ctx.beginPath();ctx.moveTo(136,-148);ctx.lineTo(-14,-72);ctx.lineTo(-34,2);ctx.stroke();
        ctx.restore();

        ctx.fillStyle = cachedRibGrad;
        ctx.beginPath();
        ctx.roundRect(-37, -7, 74, 13, 6);
        ctx.fill();

        const tailSway = Math.sin(time * 0.0025) * 3;
        ctx.beginPath();
        ctx.moveTo(-6, 3);
        ctx.quadraticCurveTo(-22, 34, -36 + tailSway, 70);
        ctx.lineTo(-21 + tailSway, 67);
        ctx.quadraticCurveTo(-10, 36, 2, 4);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(6, 3);
        ctx.quadraticCurveTo(22, 34, 36 + tailSway, 70);
        ctx.lineTo(21 + tailSway, 67);
        ctx.quadraticCurveTo(10, 36, -2, 4);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        // Subtle contact shadow
        ctx.fillStyle = 'rgba(20, 5, 12, 0.18)';
        ctx.beginPath();
        ctx.ellipse(0, 4, 38, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = ribGrad;
        ctx.strokeStyle = '#ffe3ee';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -1);
        ctx.bezierCurveTo(-28, -22, -52, -14, -46, 5);
        ctx.bezierCurveTo(-40, 20, -18, 12, 0, -1);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, -1);
        ctx.bezierCurveTo(28, -22, 52, -14, 46, 5);
        ctx.bezierCurveTo(40, 20, 18, 12, 0, -1);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = 'rgba(176, 48, 96, 0.55)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-34, -1);
        ctx.quadraticCurveTo(-18, -3, -6, -1);
        ctx.moveTo(34, -1);
        ctx.quadraticCurveTo(18, -3, 6, -1);
        ctx.stroke();

        ctx.fillStyle = '#e86492';
        ctx.beginPath();
        ctx.ellipse(0, -1, 8.5, 7.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffdce9';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();

        ctx.restore();
      }

      ctx.restore();

      const lilyProg = clamp01((elapsed - 1.45) / 1.0);
      const lilyOffset = Math.min(165, W * 0.34);
      drawLilyOfTheValley(ctx, centerX - lilyOffset, H - 28, -1, lilyProg, time);
      drawLilyOfTheValley(ctx, centerX + lilyOffset, H - 28,  1, lilyProg, time);

      const envCard = document.getElementById('envelopeCard');
      if (envCard) {
        const cardY = baseTieY - 92 * bScale;
        envCard.style.top = `${cardY}px`;
        envCard.style.left = `${centerX + globalSway * 0.35}px`;
      }
    }

    function drawRosePetal(ctx, x, y, size, rot, alpha, colorType) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;
      const colors = ['#e8527a', '#d63b6e', '#f2a0b5'];
      ctx.fillStyle = colors[colorType] || colors[0];
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.bezierCurveTo(-size*0.8, -size*0.6, -size*0.9, size*0.3, 0, size*0.7);
      ctx.bezierCurveTo(size*0.9, size*0.3, size*0.8, -size*0.6, 0, -size);
      ctx.fill();
      // Subtle vein
      ctx.strokeStyle = `rgba(255,255,255,${alpha*0.25})`;
      ctx.lineWidth = 0.3;
      ctx.beginPath();
      ctx.moveTo(0, -size*0.7);
      ctx.quadraticCurveTo(size*0.05, 0, 0, size*0.5);
      ctx.stroke();
      ctx.restore();
    }

    function drawWildflower(ctx, x, baseY, flower, elapsed, time) {
      const t = clamp01((elapsed - flower.delay) / 0.6);
      if (t <= 0) return;
      const g = easeOutCubic(t);
      const sway = Math.sin(time * 0.002 + flower.phase) * 2 * g;

      // Stem
      const stemTop = baseY - flower.stemH * g;
      ctx.strokeStyle = '#2a6e3f';
      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.quadraticCurveTo(x + sway * 0.5, (baseY + stemTop) * 0.5, x + sway, stemTop);
      ctx.stroke();

      // Petals
      ctx.save();
      ctx.translate(x + sway, stemTop);
      const bloom = easeOutBack(t);
      const petalSize = flower.size * bloom;
      for (let i = 0; i < flower.petalCount; i++) {
        const angle = (i / flower.petalCount) * Math.PI * 2 + Math.sin(time * 0.001) * 0.05;
        ctx.save();
        ctx.rotate(angle);
        ctx.fillStyle = flower.color;
        ctx.globalAlpha = 0.7 * g;
        ctx.beginPath();
        ctx.ellipse(0, -petalSize * 1.2, petalSize * 0.45, petalSize * 1.1, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // Center dot
      ctx.fillStyle = '#ffe680';
      ctx.globalAlpha = 0.9 * g;
      ctx.beginPath();
      ctx.arc(0, 0, petalSize * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function animate(time) {
      // Smooth parallax interpolation
      mouseX += (targetMX - mouseX) * 0.03;
      mouseY += (targetMY - mouseY) * 0.03;
      const px = (mouseX - 0.5) * 2; // -1 to 1
      const py = (mouseY - 0.5) * 2;

      // Premium deep sky with warm undertones (pre-cached, zero allocation)
      ctx.fillStyle = cachedSkyGrad;
      ctx.fillRect(0, 0, W, H);

      // Secondary rose-tinted atmosphere (for 20/10)
      ctx.fillStyle = cachedRoseTint;
      ctx.fillRect(0, 0, W, H);

      // === AURORA BOREALIS (DẢI CỰC QUANG HUYỀN DIỆU - pre-baked gradients) ===
      for (const aw of auroraWaves) {
        ctx.save();
        const auroraAlpha = aw.alpha * (0.65 + 0.35 * Math.sin(time * 0.00045 + aw.hue));
        ctx.globalAlpha = auroraAlpha;
        ctx.globalCompositeOperation = 'screen';

        ctx.fillStyle = aw.grad;
        ctx.beginPath();
        ctx.moveTo(0, aw.yBase + aw.width * 0.5);
        for (let ax = 0; ax <= W; ax += 28) {
          const wave1 = Math.sin(ax * aw.freq + time * aw.speed) * aw.amplitude;
          const wave2 = Math.sin(ax * aw.freq * 1.6 + time * aw.speed * 0.7 + 2) * (aw.amplitude * 0.45);
          ctx.lineTo(ax, aw.yBase - aw.width * 0.5 + wave1 + wave2);
        }
        ctx.lineTo(W, aw.yBase + aw.width * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Horizon glow (warm amber-rose at the base)
      ctx.fillStyle = cachedHorizGlow;
      ctx.fillRect(0, 0, W, H);

      // === CRESCENT MOON === (with parallax)
      const moonX = W * 0.17 + px * 8, moonY = H * 0.12 + py * 5, moonR = Math.min(34, W * 0.075);
      const moonPulse = 1 + Math.sin(time * 0.0008) * 0.04;

      // Soft light rays emanating from moon
      ctx.save();
      ctx.globalAlpha = 0.022 + Math.sin(time * 0.0006) * 0.008;
      ctx.fillStyle = 'rgba(215, 230, 255, 0.4)';
      for (let i = 0; i < 4; i++) {
        const rayAngle = (i / 4) * Math.PI * 2 + time * 0.00008;
        const rayLen = moonR * (4.5 + Math.sin(time * 0.001 + i * 1.5) * 1.2);
        const rayW = moonR * 0.5;
        ctx.save();
        ctx.translate(moonX, moonY);
        ctx.rotate(rayAngle);
        ctx.beginPath();
        ctx.moveTo(moonR * 0.7, 0);
        ctx.lineTo(rayLen, -rayW * 0.15);
        ctx.lineTo(rayLen, rayW * 0.15);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();

      // Outer halo layers (bounded circles, zero shadowBlur)
      const h2R = moonR * 3.2 * moonPulse;
      ctx.fillStyle = 'rgba(180, 205, 240, 0.035)';
      ctx.beginPath(); ctx.arc(moonX, moonY, h2R, 0, Math.PI * 2); ctx.fill();

      const h1R = moonR * 1.8;
      ctx.fillStyle = 'rgba(230, 240, 255, 0.08)';
      ctx.beginPath(); ctx.arc(moonX, moonY, h1R, 0, Math.PI * 2); ctx.fill();

      // Moon body (crescent)
      ctx.save();
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, Math.PI*2);
      ctx.arc(moonX + moonR*0.42, moonY - moonR*0.12, moonR*0.8, 0, Math.PI*2, true);
      ctx.clip();

      ctx.fillStyle = '#f2edd9';
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, Math.PI*2);
      ctx.fill();

      // Mare (dark regions)
      ctx.globalAlpha = 0.06;
      ctx.fillStyle = '#8a8068';
      ctx.beginPath(); ctx.arc(moonX - moonR*0.28, moonY + moonR*0.12, moonR*0.14, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(moonX - moonR*0.08, moonY - moonR*0.28, moonR*0.09, 0, Math.PI*2); ctx.fill();

      // Lit edge highlight
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = '#fff8e8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR - 0.5, -Math.PI * 0.4, Math.PI * 0.6);
      ctx.stroke();
      ctx.restore();

      // === STARS ===
      for (const s of stars) {
        const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
        const a = s.alpha * tw;

        if (s.isBright) {
          // Cross-sparkle with soft 45° diagonals
          const sparkLen = s.r * (3.2 + Math.sin(time * 0.002 + s.phase) * 0.8);
          const sparkAlpha = a * 0.5;
          const col = s.hue > 100 ? '200,220,255' : '255,240,200';
          ctx.strokeStyle = `rgba(${col},${sparkAlpha})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(s.x - sparkLen, s.y); ctx.lineTo(s.x + sparkLen, s.y);
          ctx.moveTo(s.x, s.y - sparkLen); ctx.lineTo(s.x, s.y + sparkLen);
          ctx.stroke();

          // Outer soft glow
          ctx.fillStyle = `rgba(${col},${a * 0.25})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 2.4, 0, Math.PI * 2);
          ctx.fill();

          // Bright star core
          ctx.fillStyle = `rgba(${col},${a})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(228, 238, 255, ${a})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // === FALLING ROSE PETALS ===
      for (const p of petals) {
        p.x += p.vx + Math.sin(time * p.wobbleSpeed + p.wobblePhase) * 0.4;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        if (p.y > H * 0.75) {
          p.y = -p.size * 3;
          p.x = Math.random() * W;
        }
        drawRosePetal(ctx, p.x, p.y, p.size, p.rot, p.alpha, p.color);
      }

      // === WISPY CLOUDS ===
      for (const c of clouds) {
        c.x += c.speed;
        if (c.x > W + c.w) c.x = -c.w;
        if (c.x < -c.w) c.x = W + c.w;

        ctx.save();
        ctx.globalAlpha = c.alpha;
        ctx.fillStyle = 'rgba(165, 190, 225, 0.28)';
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.w * 0.5, c.h, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(c.x + c.w * 0.2, c.y - c.h * 0.35, c.w * 0.32, c.h * 0.75, 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(c.x - c.w * 0.15, c.y + c.h * 0.2, c.w * 0.28, c.h * 0.6, -0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (Math.random() < 0.022 && shootingStars.length < 2) {
        spawnShootingStar();
      }
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const st = shootingStars[i];
        st.x += st.vx;
        st.y += st.vy;
        st.life -= st.decay;
        if (st.life <= 0) {
          shootingStars.splice(i, 1);
          continue;
        }
        const tx = st.x - st.vx * (st.len / 9);
        const ty = st.y - st.vy * (st.len / 9);
        const g = ctx.createLinearGradient(st.x, st.y, tx, ty);
        g.addColorStop(0, `rgba(255, 255, 255, ${st.life})`);
        g.addColorStop(0.3, `rgba(165, 230, 255, ${st.life * 0.75})`);
        g.addColorStop(1, 'rgba(155, 220, 255, 0)');
        ctx.strokeStyle = g;
        ctx.lineWidth = 2.0;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(tx, ty);
        ctx.stroke();
      }

      // === FLOATING SKY LANTERNS (ĐÈN LỒNG TRỜI BAY BỔNG - TANGLED STYLE) ===
      for (const l of lanterns) {
        l.y -= l.speed;
        l.x += l.drift + Math.sin(time * l.wobbleSpeed + l.wobblePhase) * 0.28;
        if (l.y < -l.size * 5) {
          l.y = H + l.size * 2;
          l.x = Math.random() * W;
        }

        const depthFactor = l.size / 10;
        const lx = (l.x + px * depthFactor * 16 + W) % W;
        const ly = l.y + py * depthFactor * 10;

        const flicker = 0.88 + 0.12 * Math.sin(time * 0.0032 + l.glowPhase);
        const lAlpha = l.alpha;

        ctx.save();
        if (l.size <= 5.0) {
          ctx.fillStyle = `hsla(${l.hue}, 95%, 68%, ${lAlpha * 0.35 * flicker})`;
          ctx.beginPath();
          ctx.arc(lx, ly, l.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `hsla(${l.hue + 8}, 95%, 85%, ${lAlpha * flicker})`;
          ctx.beginPath();
          ctx.arc(lx, ly, l.size * 0.75, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          continue;
        }

        // 1. Warm outer corona glow
        const glowR = l.size * 2.8;
        ctx.fillStyle = `hsla(${l.hue}, 95%, 65%, ${lAlpha * 0.20 * flicker})`;
        ctx.beginPath();
        ctx.arc(lx, ly, glowR, 0, Math.PI * 2);
        ctx.fill();

        // 2. Lantern paper body
        const lw = l.size * 0.95;
        const lh = l.size * 1.35;
        const tilt = Math.sin(time * l.wobbleSpeed + l.wobblePhase) * 0.08;

        ctx.translate(lx, ly);
        ctx.rotate(tilt);

        ctx.fillStyle = `hsla(${l.hue}, 92%, 65%, ${lAlpha * 0.94})`;
        ctx.beginPath();
        ctx.moveTo(-lw * 0.42, -lh * 0.5);
        ctx.quadraticCurveTo(0, -lh * 0.56, lw * 0.42, -lh * 0.5);
        ctx.quadraticCurveTo(lw * 0.58, 0, lw * 0.48, lh * 0.46);
        ctx.quadraticCurveTo(0, lh * 0.52, -lw * 0.48, lh * 0.46);
        ctx.quadraticCurveTo(-lw * 0.58, 0, -lw * 0.42, -lh * 0.5);
        ctx.closePath();
        ctx.fill();

        // 3. Delicate bamboo rib lines (for medium/large lanterns)
        if (l.size > 5.5) {
          ctx.strokeStyle = `rgba(255, 235, 180, ${lAlpha * 0.35})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(0, -lh * 0.52);
          ctx.lineTo(0, lh * 0.48);
          ctx.moveTo(-lw * 0.24, -lh * 0.5);
          ctx.quadraticCurveTo(-lw * 0.28, 0, -lw * 0.26, lh * 0.46);
          ctx.moveTo(lw * 0.24, -lh * 0.5);
          ctx.quadraticCurveTo(lw * 0.28, 0, lw * 0.26, lh * 0.46);
          ctx.stroke();
        }

        // 4. Inner bright candle flame at base
        const flameR = l.size * 0.36;
        ctx.fillStyle = `rgba(255, 215, 80, ${lAlpha * 0.65 * flicker})`;
        ctx.beginPath();
        ctx.arc(0, lh * 0.28, flameR * 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255, 255, 245, ${lAlpha * flicker})`;
        ctx.beginPath();
        ctx.arc(0, lh * 0.28, flameR * 0.65, 0, Math.PI * 2);
        ctx.fill();

        // 5. Dark wooden/bamboo bottom rim
        ctx.strokeStyle = `rgba(60, 24, 10, ${lAlpha * 0.65})`;
        ctx.lineWidth = Math.max(0.6, l.size * 0.08);
        ctx.beginPath();
        ctx.ellipse(0, lh * 0.47, lw * 0.46, l.size * 0.1, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      if (appState !== 'HOLD') {
        const elapsed = (performance.now() - growStartTime) / 1000;
        const landAlpha = clamp01(elapsed / 0.65);

        ctx.save();
        ctx.globalAlpha = landAlpha;

        const horizonY = H * 0.72;

        // Distant hills with moonlight edge (cachedHill1Grad)
        ctx.fillStyle = cachedHill1Grad;
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, horizonY - 8);
        ctx.bezierCurveTo(W * 0.22, horizonY - 48, W * 0.52, horizonY + 14, W, horizonY - 28);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        // Moonlight on hill ridge
        ctx.save();
        ctx.globalAlpha = 0.06;
        ctx.strokeStyle = '#a0b8d8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, horizonY - 8);
        ctx.bezierCurveTo(W * 0.22, horizonY - 48, W * 0.52, horizonY + 14, W, horizonY - 28);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#061733';
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, horizonY + 16);
        ctx.bezierCurveTo(W * 0.34, horizonY + 38, W * 0.66, horizonY - 18, W, horizonY + 12);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        // === SERENE REFLECTIVE LAKE (MẶT HỒ PHẢN CHIẾU ÁNH TRĂNG) ===
        const lakeTopY = horizonY + 10;
        const lakeBottomY = H - 55;

        // 1. Deep midnight water surface (cachedLakeGrad)
        ctx.fillStyle = cachedLakeGrad;
        ctx.beginPath();
        ctx.moveTo(0, lakeTopY);
        ctx.lineTo(W, lakeTopY);
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.closePath();
        ctx.fill();

        // 2. Wide moonlight path (cachedMoonColGrad)
        if (cachedMoonColGrad) {
          ctx.fillStyle = cachedMoonColGrad;
          ctx.fillRect(0, lakeTopY, W, H - lakeTopY);
        }

        // 3. Wavering inverted reflections of floating sky lanterns on water
        for (const l of lanterns) {
          if (l.y < horizonY && l.size > 4.5) {
            const depthFactor = l.size / 10;
            const lx = (l.x + px * depthFactor * 16 + W) % W;
            const distAbove = horizonY - l.y;
            const refY = lakeTopY + distAbove * 0.28;
            if (refY > lakeTopY && refY < lakeBottomY) {
              const refW = l.size * (1.6 + Math.sin(time * 0.003 + l.glowPhase) * 0.3);
              const refH = l.size * 0.55;
              const flicker = 0.85 + 0.15 * Math.sin(time * 0.0035 + l.glowPhase);
              const refAlpha = l.alpha * 0.16 * flicker * (1 - (refY - lakeTopY) / (lakeBottomY - lakeTopY));

              ctx.fillStyle = `hsla(${l.hue}, 95%, 68%, ${refAlpha})`;
              ctx.beginPath();
              ctx.ellipse(lx, refY, refW, refH, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // 4. Shimmering silver water ripples
        ctx.save();
        const rippleCount = 12;
        for (let ri = 0; ri < rippleCount; ri++) {
          const rFrac = ri / rippleCount;
          const ry = lakeTopY + Math.pow(rFrac, 1.35) * (lakeBottomY - lakeTopY);
          const ripW = (0.2 + 0.8 * rFrac) * W * 0.28;
          const sway = Math.sin(time * 0.0022 + ri * 0.7) * (3 + ri * 0.5);
          const ripCenterX = moonX + sway;

          const ripOsc = 0.45 + 0.55 * Math.sin(time * 0.003 + ri * 1.1);
          const ripAlpha = (0.04 + 0.16 * (1 - rFrac * 0.4)) * ripOsc;

          ctx.strokeStyle = `rgba(225, 240, 255, ${ripAlpha * 0.85})`;
          ctx.lineWidth = 0.8 + rFrac * 1.0;
          ctx.beginPath();
          ctx.moveTo(ripCenterX - ripW, ry);
          ctx.quadraticCurveTo(ripCenterX, ry + Math.sin(time * 0.004 + ri) * 1.2, ripCenterX + ripW, ry);
          ctx.stroke();
        }
        ctx.restore();

        // 5. Lake Mist Wisps (zero radial gradients)
        ctx.save();
        for (let mi = 0; mi < 2; mi++) {
          const my = lakeTopY + 16 + mi * 24;
          const mx = ((time * 0.010 * (mi === 0 ? 1 : -0.75) + mi * W * 0.5) % (W * 1.5)) - W * 0.25;
          ctx.fillStyle = 'rgba(150, 190, 225, 0.024)';
          ctx.beginPath();
          ctx.ellipse(mx, my, W * 0.38, 14, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 6. Floating Water Lotus Lanterns (zero radial gradients)
        for (const wl of waterLanterns) {
          const bob = Math.sin(time * wl.speed + wl.phase) * 12;
          const wx = wl.x + bob;
          const wy = lakeTopY + wl.yFrac * (lakeBottomY - lakeTopY);
          const fFlicker = 0.85 + 0.15 * Math.sin(time * 0.0038 + wl.flamePhase);

          ctx.save();
          // Lotus lantern water reflection
          ctx.fillStyle = `rgba(255, 180, 80, ${0.28 * fFlicker})`;
          ctx.beginPath();
          ctx.ellipse(wx, wy + wl.size * 0.7, wl.size * 1.8, wl.size * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();

          // Water ripple ring around lantern
          ctx.strokeStyle = `rgba(200, 225, 255, ${0.12 * fFlicker})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.ellipse(wx, wy + wl.size * 0.35, wl.size * 1.5, wl.size * 0.45, 0, 0, Math.PI * 2);
          ctx.stroke();

          // Lotus petals base
          ctx.fillStyle = 'rgba(255, 190, 210, 0.85)';
          ctx.beginPath();
          ctx.ellipse(wx, wy + wl.size * 0.2, wl.size * 1.3, wl.size * 0.42, 0, 0, Math.PI * 2);
          ctx.fill();

          // Inner gold candle flame
          const flameR = wl.size * 0.45;
          ctx.fillStyle = `rgba(255, 215, 80, ${0.75 * fFlicker})`;
          ctx.beginPath();
          ctx.arc(wx, wy - wl.size * 0.15, flameR * 1.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(255, 255, 240, ${0.98 * fFlicker})`;
          ctx.beginPath();
          ctx.arc(wx, wy - wl.size * 0.15, flameR * 0.65, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 7. Shoreline soft luminous water edge
        ctx.save();
        ctx.strokeStyle = 'rgba(150, 190, 230, 0.09)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, lakeTopY);
        ctx.lineTo(W, lakeTopY);
        ctx.stroke();
        ctx.restore();

        // Mounds & Grass (cachedMoundGrad, cachedGrassG1, cachedGrassG2)
        ctx.fillStyle = cachedMoundGrad;
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, H - 68);
        ctx.quadraticCurveTo(W * 0.5, H - 138, W, H - 68);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        for (const b of grassBlades) {
          if (b.layer > 0) continue;
          const sway = Math.sin(time * b.speed + b.phase) * 9;
          const baseY = H - 8 - Math.sin((b.x / W) * Math.PI) * 32;
          const tipX = b.x + b.curve + sway;
          const tipY = baseY - b.h * easeOutCubic(elapsed / 0.7);
          ctx.fillStyle = '#0a2621';
          ctx.beginPath();
          ctx.moveTo(b.x - b.w, baseY + 14);
          ctx.quadraticCurveTo(b.x, baseY - b.h * 0.5, tipX, tipY);
          ctx.quadraticCurveTo(b.x + b.w * 0.5, baseY - b.h * 0.45, b.x + b.w, baseY + 14);
          ctx.closePath();
          ctx.fill();
        }

        drawBouquet(ctx, time, elapsed);

        for (const b of grassBlades) {
          if (b.layer === 0) continue;
          const sway = Math.sin(time * b.speed + b.phase) * 11;
          const baseY = H - 6 - Math.sin((b.x / W) * Math.PI) * 28;
          const curH = b.h * easeOutCubic(elapsed / 0.75);
          const tipX = b.x + b.curve + sway;
          const tipY = baseY - curH;

          ctx.fillStyle = b.layer === 1 ? cachedGrassG1 : cachedGrassG2;
          ctx.beginPath();
          ctx.moveTo(b.x - b.w, baseY + 14);
          ctx.quadraticCurveTo(b.x, baseY - curH * 0.5, tipX, tipY);
          ctx.quadraticCurveTo(b.x + b.w * 0.5, baseY - curH * 0.45, b.x + b.w, baseY + 14);
          ctx.closePath();
          ctx.fill();
        }

        // Wildflowers in the grass
        for (const wf of wildflowers) {
          const baseY = H - 6 - Math.sin((wf.x / W) * Math.PI) * 28;
          drawWildflower(ctx, wf.x, baseY, wf, elapsed, time);
        }

        // Fireflies (fast dual-disc, zero garbage allocation)
        for (const f of fireflies) {
          f.x += f.vx + Math.sin(time * 0.0012 + f.phase) * 0.22;
          f.y += f.vy;
          if (f.y < H * 0.16) {
            f.y = H - 18;
            f.x = Math.random() * W;
          }

          const a = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.0025 + f.phase));
          const fCol = f.isGold ? '255, 230, 115' : '135, 225, 255';
          ctx.fillStyle = `rgba(${fCol}, ${a * 0.25})`;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * 2.4, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `rgba(${fCol}, ${a})`;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ground-level mist (fast fillRect, zero radial gradients)
        ctx.fillStyle = 'rgba(120, 160, 190, 0.018)';
        ctx.fillRect(0, H - 75, W, 80);

        // Bioluminescent Lunar Moths (zero per-frame gradients)
        if (elapsed > 1.35) {
          const mothAlpha = clamp01((elapsed - 1.35) / 0.85);
          const bCenterX = W * 0.5;
          const bCenterY = H - 230;

          for (let mi = 0; mi < lunarMoths.length; mi++) {
            const m = lunarMoths[mi];
            const t = time * 0.0009 + m.flightPhase;
            const orbitX = Math.sin(t) * (115 + mi * 25);
            const orbitY = Math.sin(t * 2) * (45 + mi * 15) - 30;

            m.x = bCenterX + orbitX + px * 10;
            m.y = bCenterY + orbitY + py * 8;
            m.angle = Math.atan2(Math.cos(t * 2) * 90, Math.cos(t) * 115);

            const flap = Math.sin(time * m.wingSpeed + m.wingPhase);
            const wingOpen = Math.abs(flap) * 0.72 + 0.28;

            ctx.save();
            ctx.globalAlpha = mothAlpha;
            ctx.translate(m.x, m.y);
            ctx.rotate(m.angle);

            // Luminescent glow aura
            ctx.fillStyle = `hsla(${m.hue}, 90%, 75%, 0.25)`;
            ctx.beginPath();
            ctx.arc(0, 0, m.baseSize * 2.8, 0, Math.PI * 2);
            ctx.fill();

            // Left wing pair
            ctx.save();
            ctx.scale(wingOpen, 1);
            ctx.fillStyle = `hsla(${m.hue}, 90%, 82%, 0.75)`;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-m.baseSize * 1.6, -m.baseSize * 2.5, -m.baseSize * 3.0, -m.baseSize * 1.3, 0, -m.baseSize * 0.3);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-m.baseSize * 1.3, m.baseSize * 1.6, -m.baseSize * 2.1, m.baseSize * 0.9, 0, m.baseSize * 0.4);
            ctx.fill();
            ctx.restore();

            // Right wing pair
            ctx.save();
            ctx.scale(-wingOpen, 1);
            ctx.fillStyle = `hsla(${m.hue}, 90%, 82%, 0.75)`;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-m.baseSize * 1.6, -m.baseSize * 2.5, -m.baseSize * 3.0, -m.baseSize * 1.3, 0, -m.baseSize * 0.3);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-m.baseSize * 1.3, m.baseSize * 1.6, -m.baseSize * 2.1, m.baseSize * 0.9, 0, m.baseSize * 0.4);
            ctx.fill();
            ctx.restore();

            // Slender luminescent body & delicate antennae
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, 0, 1.0, m.baseSize * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(-0.5, -m.baseSize * 0.4); ctx.quadraticCurveTo(-1.8, -m.baseSize * 0.8, -2.6, -m.baseSize * 1.1);
            ctx.moveTo(0.5, -m.baseSize * 0.4); ctx.quadraticCurveTo(1.8, -m.baseSize * 0.8, 2.6, -m.baseSize * 1.1);
            ctx.stroke();

            ctx.restore();

            // Sparkle dust trail shed from moth wings
            if (Math.random() < 0.20 && sparkles.length < 80) {
              sparkles.push({
                x: m.x + (Math.random() - 0.5) * 6,
                y: m.y + (Math.random() - 0.5) * 6,
                vx: (Math.random() - 0.5) * 0.35,
                vy: Math.random() * 0.25 + 0.1,
                r: Math.random() * 1.2 + 0.5,
                color: `hsla(${m.hue}, 95%, 82%, 0.85)`,
                alpha: 0.85,
                decay: 0.024
              });
            }
          }
        }

        ctx.restore();
      }

      for (let i = sparkles.length - 1; i >= 0; i--) {
        const p = sparkles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy -= 0.012;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          sparkles.splice(i, 1);
          continue;
        }
        const pa = Math.max(0, p.alpha);
        ctx.globalAlpha = pa;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      requestAnimationFrame(animate);
    }

    const holdStage = document.getElementById('holdStage');
    const holdRing = document.getElementById('holdRing');
    const btnHold = document.getElementById('btnHold');
    const skyTitle = document.getElementById('skyTitle');
    const envelopeCard = document.getElementById('envelopeCard');
    const letterBackdrop = document.getElementById('letterBackdrop');
    const vintageLetterModal = document.getElementById('vintageLetterModal');
    const letterHeading = document.getElementById('letterHeading');
    const letterBody = document.getElementById('letterBody');

    let holdProgress = 0;
    let isHolding = false;
    let holdRAF = null;
    let sequenceTimers = [];
    let typewriterTimer = null;

    function beginHold(e) {
      if (e.type === 'touchstart') e.preventDefault();
      if (appState !== 'HOLD') return;
      startMusic();
      isHolding = true;

      function updateHold() {
        if (!isHolding || appState !== 'HOLD') return;
        holdProgress += 5.5;
        const offset = 263.9 - (Math.min(100, holdProgress) / 100) * 263.9;
        holdRing.style.strokeDashoffset = offset;
        if (Math.random() < 0.4) {
          spawnSparkleBurst(W * 0.5, H - 75, 3);
        }
        if (holdProgress >= 100) {
          isHolding = false;
          triggerBouquetGrowth();
        } else {
          holdRAF = requestAnimationFrame(updateHold);
        }
      }
      cancelAnimationFrame(holdRAF);
      holdRAF = requestAnimationFrame(updateHold);
    }

    function endHold() {
      if (appState !== 'HOLD') return;
      isHolding = false;
      if (holdProgress > 0 && holdProgress < 100) {
        function autoCompleteTap() {
          if (appState !== 'HOLD') return;
          holdProgress += 8.5;
          const offset = 263.9 - (Math.min(100, holdProgress) / 100) * 263.9;
          holdRing.style.strokeDashoffset = offset;
          if (holdProgress >= 100) {
            triggerBouquetGrowth();
          } else {
            requestAnimationFrame(autoCompleteTap);
          }
        }
        requestAnimationFrame(autoCompleteTap);
      }
    }

    btnHold.addEventListener('mousedown', beginHold);
    btnHold.addEventListener('click', (e) => {
      e.stopPropagation();
      if (appState === 'HOLD' && !isHolding) {
        startMusic();
        function fastFill() {
          if (appState !== 'HOLD') return;
          holdProgress += 9.5;
          const offset = 263.9 - (Math.min(100, holdProgress) / 100) * 263.9;
          holdRing.style.strokeDashoffset = offset;
          if (holdProgress >= 100) {
            triggerBouquetGrowth();
          } else {
            requestAnimationFrame(fastFill);
          }
        }
        requestAnimationFrame(fastFill);
      }
    });
    btnHold.addEventListener('touchstart', beginHold, { passive: false });
    window.addEventListener('mouseup', endHold);
    window.addEventListener('touchend', endHold);

    function triggerBouquetGrowth() {
      if (appState !== 'HOLD') return;
      appState = 'GROWING';
      growStartTime = performance.now();
      playSparkleChime();
      spawnSparkleBurst(W * 0.5, H - 90, 40);

      holdStage.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
      setTimeout(() => {
        holdStage.style.display = 'none';
      }, 700);

      sequenceTimers.push(setTimeout(() => {
        skyTitle.classList.remove('opacity-0', 'translate-y-2');
        skyTitle.classList.add('opacity-100', 'translate-y-0');
      }, 300));

      sequenceTimers.push(setTimeout(() => {
        playSparkleChime();
        spawnSparkleBurst(W * 0.5, H * 0.52, 45);
      }, 950));

      sequenceTimers.push(setTimeout(() => {
        playSparkleChime();
        spawnSparkleBurst(W * 0.5, H * 0.48, 60);
      }, 2000));

      sequenceTimers.push(setTimeout(() => {
        showEnvelopeOnBouquet();
      }, 2900));
    }

    function showEnvelopeOnBouquet() {
      envelopeCard.classList.remove('opacity-0', 'pointer-events-none');
      envelopeCard.classList.add('opacity-100', 'pointer-events-auto');
      envelopeCard.style.transform = 'translate(-50%, -50%) scale(1) rotate(-1.5deg)';
    }

    function openVintageLetter(e) {
      if (e) e.stopPropagation();
      playSparkleChime();
      spawnSparkleBurst(W * 0.5, H * 0.5, 35);

      letterBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      letterBackdrop.classList.add('opacity-100', 'pointer-events-auto');
      vintageLetterModal.classList.remove('scale-75');
      vintageLetterModal.classList.add('scale-100');

      startTypewriterLetter();
    }

    envelopeCard.addEventListener('click', openVintageLetter);
    envelopeCard.addEventListener('keydown', (e) => {
      if(e.key==='Enter'||e.key===' ') { e.preventDefault();openVintageLetter(e); }
    });
    envelopeCard.addEventListener('touchend', (e) => {
      e.preventDefault();
      openVintageLetter(e);
    });

    function startTypewriterLetter() {
      if (typewriterTimer) clearTimeout(typewriterTimer);
      letterHeading.innerHTML = letterTitleHTML;
      letterBody.innerHTML = '';

      let pIdx = 0;
      let cIdx = 0;
      let pElem = null;

      function typeStep() {
        if (pIdx >= letterParagraphs.length) {
          return;
        }
        if (cIdx === 0) {
          pElem = document.createElement('p');
          letterBody.appendChild(pElem);
        }
        const text = letterParagraphs[pIdx];
        cIdx += 2;
        pElem.textContent = text.slice(0, cIdx);

        if (cIdx >= text.length) {
          pIdx++;
          cIdx = 0;
          typewriterTimer = setTimeout(typeStep, 180);
        } else {
          typewriterTimer = setTimeout(typeStep, 20);
        }
      }
      typeStep();
    }

    function closeVintageLetter(e) {
      if (e) e.stopPropagation();
      if (typewriterTimer) clearTimeout(typewriterTimer);
      playSparkleChime();
      spawnSparkleBurst(W * 0.5, H * 0.52, 35);

      letterBackdrop.classList.remove('opacity-100', 'pointer-events-auto');
      letterBackdrop.classList.add('opacity-0', 'pointer-events-none');
      vintageLetterModal.classList.remove('scale-100');
      vintageLetterModal.classList.add('scale-75');

      // Ẩn hoàn toàn phong thư nhỏ trên bó hoa khi bấm đóng thư
      envelopeCard.classList.remove('opacity-100', 'pointer-events-auto');
      envelopeCard.classList.add('opacity-0', 'pointer-events-none');
      envelopeCard.style.display = 'none';
    }

    document.getElementById('btnCloseLetter').addEventListener('click', closeVintageLetter);

    const btnSound = document.getElementById('btnSoundToggle');
    if (btnSound) {
      btnSound.addEventListener('click', toggleSound);
    }

    // Tap/Click anywhere on sky/canvas to create celestial fairy dust bursts
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#btnHold, #btnSoundToggle, #vintageLetterModal, #btnCloseLetter')) return;
      spawnSparkleBurst(e.clientX, e.clientY, 16);
      if (Math.random() < 0.35) playSparkleChime();
    });

    window.addEventListener('resize', initScene);
    window.onload = () => {
      initScene();
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
