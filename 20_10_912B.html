<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chúc Mừng 20/10 Các Bạn Nữ Lớp 9/12 💐</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040716;
      font-family: 'Quicksand', sans-serif;
      color: #ffffff;
    }

    .font-cursive {
      font-family: 'Dancing Script', cursive;
    }

    /* Glowing Sky Title */
    .glow-title {
      color: #eef8ff;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.95),
        0 0 18px rgba(125, 211, 252, 0.85),
        0 0 36px rgba(56, 189, 248, 0.65);
      animation: titleBreathe 4s ease-in-out infinite;
    }

    @keyframes titleBreathe {
      0%, 100% { transform: translateY(0px); filter: brightness(1); }
      50% { transform: translateY(-4px); filter: brightness(1.1); }
    }

    /* Hold Button Ripples — perfectly centered rose-gold aura */
    .hold-ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      margin-top: -35px;
      margin-left: -35px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 182, 193, 0.5);
      box-shadow: 0 0 16px rgba(255, 150, 185, 0.35), inset 0 0 10px rgba(255, 200, 215, 0.18);
      animation: rippleOut 3s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      pointer-events: none;
    }
    .hold-ripple-2 {
      animation-delay: 1.0s;
      border-color: rgba(210, 175, 255, 0.42);
      box-shadow: 0 0 16px rgba(195, 150, 255, 0.28);
    }
    .hold-ripple-3 {
      animation-delay: 2.0s;
      border-color: rgba(175, 220, 255, 0.36);
      box-shadow: 0 0 16px rgba(140, 200, 255, 0.22);
    }

    @keyframes rippleOut {
      0% { transform: scale(1); opacity: 0.88; }
      55% { opacity: 0.32; }
      100% { transform: scale(2.75); opacity: 0; }
    }

    /* Ambient breathing aura behind the orb */
    .button-glow-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      margin-top: -48px;
      margin-left: -48px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 190, 0.38) 0%, rgba(185, 130, 255, 0.2) 46%, rgba(0, 0, 0, 0) 72%);
      filter: blur(10px);
      animation: haloBreathe 3.6s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes haloBreathe {
      0% { transform: scale(0.92); opacity: 0.65; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    /* Dual Orbiting cosmic particles around button */
    .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 104px;
      height: 104px;
      margin-top: -52px;
      margin-left: -52px;
      border-radius: 50%;
      animation: orbitSpin 10s linear infinite;
      pointer-events: none;
    }
    .orbit-ring-rev {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 124px;
      height: 124px;
      margin-top: -62px;
      margin-left: -62px;
      border-radius: 50%;
      animation: orbitSpinRev 14s linear infinite;
      pointer-events: none;
    }
    .orbit-dot {
      position: absolute;
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: rgba(255, 210, 228, 0.9);
      box-shadow: 0 0 8px rgba(255, 180, 210, 0.85);
    }
    .orbit-dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
    .orbit-dot:nth-child(2) { bottom: 0; left: 50%; transform: translateX(-50%); background: rgba(215, 185, 255, 0.85); box-shadow: 0 0 8px rgba(200, 160, 255, 0.8); }
    .orbit-dot:nth-child(3) { top: 50%; right: 0; transform: translateY(-50%); background: rgba(185, 225, 255, 0.85); box-shadow: 0 0 8px rgba(150, 210, 255, 0.8); }
    .orbit-dot:nth-child(4) { top: 50%; left: 0; transform: translateY(-50%); background: rgba(255, 235, 190, 0.85); box-shadow: 0 0 8px rgba(255, 220, 150, 0.75); }

    .orbit-dot-gold {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 238, 175, 0.85);
      box-shadow: 0 0 7px rgba(255, 225, 140, 0.8);
    }
    .orbit-dot-gold:nth-child(1) { top: 18%; left: 18%; }
    .orbit-dot-gold:nth-child(2) { bottom: 18%; right: 18%; }
    .orbit-dot-gold:nth-child(3) { top: 75%; left: 15%; }

    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitSpinRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Glass orb button — exquisite crystal sphere */
    .glass-orb {
      position: relative;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 26%, rgba(255,245,250,0.4) 0%, rgba(255,190,215,0.18) 32%, rgba(150,110,210,0.12) 65%, rgba(20,15,45,0.32) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 220, 235, 0.45);
      box-shadow:
        0 0 28px rgba(255, 145, 185, 0.45),
        0 0 55px rgba(186, 120, 240, 0.22),
        inset 0 2px 3px rgba(255, 255, 255, 0.65),
        inset 0 -2px 6px rgba(110, 50, 130, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      animation: orbPulse 3.2s ease-in-out infinite;
      user-select: none;
      -webkit-user-select: none;
    }
    .glass-orb:hover {
      transform: scale(1.08);
      box-shadow:
        0 0 38px rgba(255, 150, 195, 0.7),
        0 0 75px rgba(195, 135, 255, 0.4),
        inset 0 2px 4px rgba(255, 255, 255, 0.8),
        inset 0 -2px 8px rgba(120, 60, 145, 0.35);
    }
    .glass-orb:active {
      transform: scale(0.92);
      box-shadow:
        0 0 20px rgba(255, 145, 185, 0.55),
        0 0 40px rgba(186, 120, 240, 0.35);
    }
    .glass-orb::before {
      content: '';
      position: absolute;
      top: 7px;
      left: 12px;
      width: 24px;
      height: 13px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.02) 100%);
      transform: rotate(-18deg);
      pointer-events: none;
    }
    .glass-orb::after {
      content: '';
      position: absolute;
      bottom: 9px;
      right: 14px;
      width: 10px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      transform: rotate(-12deg);
      pointer-events: none;
    }

    @keyframes orbPulse {
      0%, 100% {
        box-shadow:
          0 0 28px rgba(255, 145, 185, 0.45),
          0 0 55px rgba(186, 120, 240, 0.22),
          inset 0 2px 3px rgba(255, 255, 255, 0.65),
          inset 0 -2px 6px rgba(110, 50, 130, 0.25);
      }
      50% {
        box-shadow:
          0 0 42px rgba(255, 155, 195, 0.65),
          0 0 85px rgba(195, 135, 255, 0.35),
          inset 0 2px 4px rgba(255, 255, 255, 0.75),
          inset 0 -2px 8px rgba(120, 60, 145, 0.32);
      }
    }

    /* Tulip inside button micro-animation */
    .orb-tulip {
      animation: flowerFloat 3.6s ease-in-out infinite;
      filter: drop-shadow(0 2px 5px rgba(220, 50, 110, 0.35));
      transition: filter 0.25s ease, transform 0.25s ease;
    }
    .glass-orb:hover .orb-tulip {
      filter: drop-shadow(0 0 8px rgba(255, 190, 220, 0.9)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
    }
    @keyframes flowerFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(2deg); }
    }

    /* Prompt text animation */
    .prompt-text {
      animation: textFloat 3.6s ease-in-out infinite;
      letter-spacing: 0.08em;
    }
    @keyframes textFloat {
      0%, 100% { transform: translateY(0); opacity: 0.92; }
      50% { transform: translateY(-3px); opacity: 1; }
    }

    /* Clickable Envelope Card on the Bouquet */
    .envelope-card {
      background: linear-gradient(180deg, #fffdf9 0%, #f5e5cc 100%);
      border: 2px solid #e2c59f;
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.58),
        0 0 26px rgba(255, 215, 175, 0.45);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      animation: cardFloat 3s ease-in-out infinite;
    }

    .envelope-card:hover {
      transform: translate(-50%, -52%) scale(1.04) rotate(-1deg) !important;
    }

    .envelope-card:active {
      transform: translate(-50%, -50%) scale(0.97) !important;
    }

    @keyframes cardFloat {
      0%, 100% { filter: drop-shadow(0 10px 20px rgba(0,0,0,0.45)); }
      50% { filter: drop-shadow(0 14px 28px rgba(255,182,193,0.45)); }
    }

    /* Vintage Wavy/Scalloped-Edge Letter Sheet */
    .vintage-letter-modal {
      filter: drop-shadow(0 22px 42px rgba(0, 0, 0, 0.72)) drop-shadow(0 0 24px rgba(255, 220, 185, 0.35));
      transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .vintage-letter-paper {
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.75) 0%, transparent 55%),
        radial-gradient(circle at 82% 85%, rgba(216, 178, 132, 0.38) 0%, transparent 60%),
        linear-gradient(168deg, #fffcf6 0%, #f7e9d3 52%, #ecd6b6 100%);
      color: #463020;
      clip-path: polygon(
        1.5% 2.2%, 5% 0.8%, 9% 2%, 14% 0.7%, 19% 1.9%, 24% 0.6%, 29% 1.8%, 35% 0.6%, 41% 1.8%, 47% 0.5%, 53% 1.8%, 59% 0.6%, 65% 1.9%, 71% 0.7%, 77% 2%, 83% 0.7%, 89% 1.9%, 94% 0.8%, 98.5% 2.2%,
        99.3% 7%, 98.2% 13%, 99.4% 19%, 98.3% 25%, 99.5% 32%, 98.3% 39%, 99.5% 46%, 98.2% 53%, 99.4% 60%, 98.3% 67%, 99.5% 74%, 98.2% 81%, 99.4% 88%, 98.3% 94%, 98.8% 97.8%,
        94% 99.2%, 88% 98.1%, 82% 99.4%, 76% 98.2%, 70% 99.4%, 64% 98.1%, 58% 99.4%, 52% 98.2%, 46% 99.5%, 40% 98.1%, 34% 99.4%, 28% 98.2%, 22% 99.3%, 16% 98.1%, 10% 99.2%, 5% 98.1%, 1.2% 97.8%,
        0.6% 92%, 1.8% 85%, 0.5% 78%, 1.7% 71%, 0.5% 64%, 1.7% 57%, 0.5% 50%, 1.7% 43%, 0.5% 36%, 1.7% 29%, 0.5% 22%, 1.7% 15%, 0.6% 8%
      );
      box-shadow: inset 0 0 38px rgba(176, 132, 85, 0.35);
    }

    .letter-scroll::-webkit-scrollbar { width: 4px; }
    .letter-scroll::-webkit-scrollbar-thumb { background: rgba(180, 135, 90, 0.45); border-radius: 9999px; }
    /* Keep the original layout; refine only light and physical materials. */
    .glow-title {
      text-shadow: 0 2px 3px rgba(0,0,0,.3), 0 0 16px rgba(181,220,255,.45), 0 0 38px rgba(88,155,220,.22);
    }
    .envelope-card {
      background: repeating-linear-gradient(8deg,transparent 0 3px,rgba(141,103,69,.025) 3px 4px),linear-gradient(145deg,#fffcf4,#f3e0c7);
      border: 1px solid #d6b995;
      box-shadow: inset 0 1px 1px #fff, inset 0 -2px 3px #c7a47a55, 2px 12px 23px #0006;
    }
    .envelope-card > .absolute, .vintage-letter-modal > .absolute {
      background: radial-gradient(circle at 32% 25%,#ed8197,#b33959 60%,#74223e);
      border-color: #d27d8e;
      box-shadow: inset 1px 2px 3px #ffbdc566,inset -2px -2px 3px #59132977,2px 3px 5px #0005;
    }
    .vintage-letter-paper {
      background: repeating-linear-gradient(12deg,transparent 0 3px,rgba(136,92,47,.025) 3px 4px),radial-gradient(ellipse at 12% 0,#fffef9,transparent 70%),linear-gradient(135deg,#fff6e5,#f0ddbf);
    }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden select-none">

  <!-- 1. BACKGROUND CANVAS (Night Sky, Stars, Hills, Bouquet & Fireflies) -->
  <canvas id="sceneCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

  <!-- 2. GLOWING SKY TITLE -->
  <div id="skyTitle" class="fixed top-9 sm:top-11 left-0 right-0 z-10 text-center px-4 pointer-events-none opacity-0 transition-all duration-1000 transform translate-y-2">
    <h1 class="font-cursive text-[30px] sm:text-5xl glow-title leading-tight">
      Chúc mừng ngày phụ nữ Việt Nam
    </h1>
    <p class="font-cursive text-3xl sm:text-5xl glow-title -mt-0.5">
      20/10
    </p>
  </div>

  <!-- 3. INITIAL GIFT BUTTON -->
  <div id="holdStage" class="fixed inset-x-0 bottom-10 sm:bottom-14 z-40 flex flex-col items-center justify-center transition-all duration-700">
    <div class="flex items-center gap-2 mb-4 cursor-default select-none">
      <span class="text-rose-300 text-xs sm:text-sm animate-pulse opacity-80">✦</span>
      <p class="prompt-text font-cursive text-[17px] sm:text-xl text-pink-100 font-medium tracking-wide" style="text-shadow: 0 0 14px rgba(255,180,205,0.7), 0 0 28px rgba(185,140,255,0.4), 0 1px 3px rgba(0,0,0,0.5);">
        Chạm để mở quà
      </p>
      <span class="text-rose-300 text-xs sm:text-sm animate-pulse opacity-80" style="animation-delay: 0.5s;">✦</span>
    </div>

    <div class="relative flex items-center justify-center" style="width: 140px; height: 140px;">
      <!-- Ambient Floor Reflection / Ground Glow -->
      <div class="absolute -bottom-2 w-20 h-4 rounded-full bg-pink-500/20 blur-md pointer-events-none"></div>

      <!-- Breathing Aura Halo -->
      <div class="button-glow-halo"></div>

      <!-- Concentric Ripples -->
      <div class="hold-ripple"></div>
      <div class="hold-ripple hold-ripple-2"></div>
      <div class="hold-ripple hold-ripple-3"></div>

      <!-- Dual Cosmic Orbiting particles -->
      <div class="orbit-ring">
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
      </div>
      <div class="orbit-ring-rev">
        <div class="orbit-dot-gold"></div>
        <div class="orbit-dot-gold"></div>
        <div class="orbit-dot-gold"></div>
      </div>

      <!-- Progress Ring SVG -->
      <svg class="absolute pointer-events-none" style="top: 50%; left: 50%; width: 92px; height: 92px; margin-top: -46px; margin-left: -46px;" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb8d0" />
            <stop offset="50%" stop-color="#d4a5ff" />
            <stop offset="100%" stop-color="#9cd6ff" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,200,225,0.14)" stroke-width="3" />
        <circle id="holdRing" cx="50" cy="50" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"
          style="filter: drop-shadow(0 0 7px rgba(255,180,210,0.65)); transform: rotate(-90deg); transform-origin: center;" />
      </svg>

      <!-- Glass Orb Button -->
      <button id="btnHold" class="glass-orb z-10 focus:outline-none" aria-label="Chạm để mở quà">
        <svg class="orb-tulip" width="30" height="30" viewBox="0 0 32 32" fill="none">
          <!-- Tulip flower SVG -->
          <path d="M16 28 L16 14" stroke="url(#stemG)" stroke-width="2.2" stroke-linecap="round"/>
          <!-- Left leaf -->
          <path d="M16 22 Q10 19 9 23 Q10 26 16 24" fill="#4a9e5e" opacity="0.85"/>
          <!-- Right leaf -->
          <path d="M16 20 Q22 17 23 21 Q22 24 16 22" fill="#3d8a50" opacity="0.85"/>
          <!-- Left petal -->
          <path d="M16 14 Q10 12 8 6 Q10 2 14 5 Q15 8 16 14" fill="url(#petalL)"/>
          <!-- Right petal -->
          <path d="M16 14 Q22 12 24 6 Q22 2 18 5 Q17 8 16 14" fill="url(#petalR)"/>
          <!-- Center petal -->
          <path d="M16 14 Q13 10 13 5 Q16 1 19 5 Q19 10 16 14" fill="url(#petalC)"/>
          <defs>
            <linearGradient id="stemG" x1="16" y1="28" x2="16" y2="14">
              <stop offset="0%" stop-color="#2d7a3e"/>
              <stop offset="100%" stop-color="#60c074"/>
            </linearGradient>
            <linearGradient id="petalL" x1="8" y1="12" x2="14" y2="3">
              <stop offset="0%" stop-color="#e8457a"/>
              <stop offset="100%" stop-color="#ffb8cc"/>
            </linearGradient>
            <linearGradient id="petalR" x1="24" y1="12" x2="18" y2="3">
              <stop offset="0%" stop-color="#d63b6e"/>
              <stop offset="100%" stop-color="#ffa0bb"/>
            </linearGradient>
            <linearGradient id="petalC" x1="16" y1="14" x2="16" y2="1">
              <stop offset="0%" stop-color="#ff6b9d"/>
              <stop offset="40%" stop-color="#ff8cb5"/>
              <stop offset="100%" stop-color="#ffe0ec"/>
            </linearGradient>
          </defs>
        </svg>
      </button>
    </div>
  </div>

  <!-- 4. CLICKABLE ENVELOPE CARD ON THE BOUQUET -->
  <div id="envelopeCard"
    role="button"
    tabindex="0"
    aria-label="Mở thư chúc mừng 20/10"
    class="envelope-card fixed z-[150] opacity-0 pointer-events-none w-[275px] sm:w-[330px] rounded-2xl px-5 py-3.5 text-center cursor-pointer"
    style="top: 56%; left: 50%; transform: translate(-50%, -50%) scale(0.65) rotate(-1.5deg);">

    <!-- Red Heart Seal Badge -->
    <div class="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-md border-2 border-white animate-bounce pointer-events-none">
      <span class="text-xs">❤</span>
    </div>

    <div class="border-b border-dashed border-[#d4b288] pb-1.5 mb-1.5 pointer-events-none">
      <h3 class="font-cursive text-2xl sm:text-[28px] font-bold text-[#4d321e] leading-tight">
        Gửi các bạn nữ <span class="text-rose-500">9/12</span>
      </h3>
    </div>

    <p class="font-cursive text-base sm:text-lg text-[#6e4c32] pointer-events-none flex items-center justify-center gap-1">
      <span>Chạm vào thư để mở lời chúc...</span>
      <span class="text-rose-500 text-sm">💌</span>
    </p>
  </div>

  <!-- 5. VINTAGE LETTER OVER THE BOUQUET -->
  <div id="letterBackdrop"
    class="fixed inset-0 z-[160] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-500">

    <!-- Vintage Letter Container -->
    <div id="vintageLetterModal"
      class="vintage-letter-modal relative w-[92vw] max-w-[395px] sm:max-w-[430px] transform scale-75 transition-transform duration-500 mt-3 sm:mt-5">

      <!-- Top-Right Red Heart Badge -->
      <div class="absolute -top-2.5 -right-2.5 z-30 w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg border-2 border-[#fff9f0]">
        <span class="text-xs">❤</span>
      </div>

      <div class="vintage-letter-paper relative px-6 py-6 sm:px-8 sm:py-7 max-h-[68vh] overflow-y-auto letter-scroll">
        <!-- Tiny Red Hearts Inside Paper -->
        <div class="absolute top-3 right-5 pointer-events-none flex items-center gap-1 opacity-80">
          <span class="text-rose-400 text-[10px] rotate-12">❤</span>
          <span class="text-rose-500 text-xs -rotate-12">❤</span>
        </div>

        <!-- Greeting Header -->
        <h2 id="letterHeading" class="font-cursive text-2xl sm:text-[28px] font-bold text-center text-[#4a301d] mb-3 leading-snug">
          Gửi các bạn nữ <span class="text-rose-500">9/12</span> xinh đẹp!
        </h2>

        <!-- Typewriter Body Paragraphs -->
        <div id="letterBody" class="font-cursive text-[18px] sm:text-[21px] leading-[1.6] text-[#4a311f] space-y-2.5 min-h-[185px]">
        </div>

        <!-- Close Button -->
        <div class="mt-5 text-center">
          <button id="btnCloseLetter"
            class="px-5 py-1.5 rounded-full bg-[#e6ccb0]/85 hover:bg-rose-500 hover:text-white text-[#523622] text-xs font-semibold border border-[#cda882] transition shadow-sm cursor-pointer">
            Đóng thư
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 6. SOUND / MUSIC TOGGLE BUTTON -->
  <button id="btnSoundToggle" aria-label="Bật/Tắt âm thanh" title="Âm thanh"
    class="fixed top-4 right-4 z-50 w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 active:scale-90 backdrop-blur-md border border-white/25 text-white shadow-[0_0_15px_rgba(255,200,230,0.3)] transition-all duration-300 cursor-pointer">
    <svg id="soundIconOn" class="w-5 h-5 text-pink-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">

  <script>
    /*************************************************************************
     * 1. 20/10 LETTER CONTENT FOR CLASS 9/12
     *************************************************************************/
    const letterTitleHTML = 'Gửi các bạn nữ <span class="text-rose-500">9/12</span> xinh đẹp!';
    const letterParagraphs = [
      "Nhân ngày Phụ nữ Việt Nam 20/10, chúc một nửa thế giới của tập thể 9/12 luôn rạng rỡ như những đóa hoa Tulip dưới bầu trời đêm đầy sao.",
      "Cảm ơn các bạn vì đã luôn mang đến tiếng cười, sự dịu dàng và nguồn năng lượng tích cực, làm cho mỗi ngày đến lớp đều trở nên thật ý nghĩa.",
      "Chúc các bạn nữ 9/12 luôn tự tin với nét riêng của mình, được yêu thương và trân trọng, can đảm theo đuổi những điều mình mơ ước. Mỗi bạn là một đóa hoa riêng, làm nên những kỷ niệm thật đẹp của 9/12!"
    ];

    /*************************************************************************
     * 2. AUDIO SYNTHESIZER
     *************************************************************************/
    let audioCtx = null;
    let isMusicPlaying = false;
    let isSoundMuted = false;
    let melodyTimer = null;
    let noteIndex = 0;

    const ROMANTIC_MELODY = [
      { m: 523.25, c: [261.63, 329.63, 392.00] },
      { m: 659.25, c: [261.63, 329.63] },
      { m: 783.99, c: [246.94, 392.00] },
      { m: 659.25, c: [329.63] },
      { m: 698.46, c: [220.00, 349.23, 440.00] },
      { m: 659.25, c: [220.00, 329.63] },
      { m: 587.33, c: [293.66, 349.23] },
      { m: 523.25, c: [196.00, 293.66, 392.00] },
      { m: 587.33, c: [196.00, 246.94] },
      { m: 659.25, c: [261.63, 329.63, 392.00] },
      { m: 523.25, c: [261.63, 329.63] }
    ];

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound(e) {
      if (e) e.stopPropagation();
      ensureAudio();
      isSoundMuted = !isSoundMuted;
      const soundIconOn = document.getElementById('soundIconOn');
      const soundIconOff = document.getElementById('soundIconOff');
      if (isSoundMuted) {
        if (soundIconOn) soundIconOn.classList.add('hidden');
        if (soundIconOff) soundIconOff.classList.remove('hidden');
      } else {
        if (soundIconOff) soundIconOff.classList.add('hidden');
        if (soundIconOn) soundIconOn.classList.remove('hidden');
        if (!isMusicPlaying) startMusic();
      }
    }

    function playPianoNote(freq, dur = 1.6, vol = 0.055) {
      if (!audioCtx || !isMusicPlaying || isSoundMuted) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0008, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0005, now + dur);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    function playSparkleChime() {
      if (isSoundMuted) return;
      ensureAudio();
      if (!audioCtx) return;
      const notes = [587.33, 783.99, 987.77, 1174.66, 1567.98];
      notes.forEach((f, i) => {
        setTimeout(() => {
          if (isSoundMuted || !audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.045, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0006, now + 0.65);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.65);
        }, i * 65);
      });
    }

    function startMusic() {
      ensureAudio();
      if (isMusicPlaying) return;
      isMusicPlaying = true;
      melodyTimer = setInterval(() => {
        if (!isMusicPlaying || isSoundMuted) return;
        const step = ROMANTIC_MELODY[noteIndex % ROMANTIC_MELODY.length];
        playPianoNote(step.m, 1.85, 0.06);
        step.c.forEach((cf, idx) => {
          setTimeout(() => playPianoNote(cf, 2.1, 0.03), idx * 90);
        });
        noteIndex++;
      }, 670);
    }

    /*************************************************************************
     * 3. NIGHT SKY & BOUQUET ENGINE
     *************************************************************************/
    const canvas = document.getElementById('sceneCanvas');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;

    let appState = 'HOLD';
    let growStartTime = 0;

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - clamp01(t), 3); }
    function easeOutBack(t) {
      t = clamp01(t);
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    const stars = [];
    const shootingStars = [];
    const grassBlades = [];
    const fireflies = [];
    const sparkles = [];
    const clouds = [];
    const petals = [];
    const wildflowers = [];
    const lanterns = [];
    const auroraWaves = [];

    const lunarMoths = [];

    // Interactive Fairy Dust (Bụi tiên tương tác)
    function spawnFairyDust(x, y) {
      if (sparkles.length > 75) return;
      if (Math.random() < 0.35) {
        const colors = ['#ffe6a7', '#ffb8d1', '#c5a0ff', '#a6e3ff', '#ffffff'];
        sparkles.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 0.7,
          vy: Math.random() * 0.5 + 0.3,
          r: Math.random() * 1.7 + 0.6,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 0.9,
          decay: Math.random() * 0.018 + 0.012
        });
      }
    }

      targetMX = e.clientX / window.innerWidth;
      targetMY = e.clientY / window.innerHeight;
      spawnFairyDust(e.clientX, e.clientY);
    });
    document.addEventListener('touchmove', e => {
      if (e.touches && e.touches.length > 0) {
        targetMX = e.touches[0].clientX / window.innerWidth;
        targetMY = e.touches[0].clientY / window.innerHeight;
        spawnFairyDust(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

        if (e.gamma !== null) targetMX = 0.5 + (e.gamma / 45) * 0.3;
        if (e.beta !== null) targetMY = 0.5 + ((e.beta - 45) / 45) * 0.3;
        targetMX = Math.max(0, Math.min(1, targetMX));
        targetMY = Math.max(0, Math.min(1, targetMY));
      });
    }

      { id: 3, tx: -90, ty: -214, bx: -15, angle: -0.25, scale: 0.93, stemStart: 1.35, bloomStart: 1.68, layer: 0, phase: 2.8 },
      { id: 4, tx:  90, ty: -214, bx:  15, angle:  0.25, scale: 0.93, stemStart: 1.40, bloomStart: 1.73, layer: 0, phase: 4.1 },

      { id: 6, tx: -60, ty: -184, bx: -11, angle: -0.17, scale: 0.99, stemStart: 1.44, bloomStart: 1.76, layer: 2, phase: 3.3 },
      { id: 7, tx:  60, ty: -184, bx:  11, angle:  0.17, scale: 0.99, stemStart: 1.48, bloomStart: 1.80, layer: 2, phase: 5.0 },

    const LEAF_DEFS = [

    function initScene() {
      W = window.innerWidth;
      H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

      grassBlades.length = 0;
      const bladeCount = Math.min(220, Math.floor(W / 3.6));
      for (let i = 0; i < bladeCount; i++) {
        const normX = i / bladeCount;

      fireflies.length = 0;

      // Falling rose petals

        });

      // Wildflowers on the ground
      wildflowers.length = 0;
      const flowerCount = Math.min(16, Math.floor(W / 28));
      for (let i = 0; i < flowerCount; i++) {
        const normX = (i + 0.5) / flowerCount;
        wildflowers.push({
          x: normX * W + (Math.random() - 0.5) * 30,
          petalCount: Math.floor(Math.random() * 2) + 5,
          size: Math.random() * 3.0 + 1.8,
          stemH: Math.random() * 18 + 8,
          color: Math.random() < 0.4 ? '#ffb8d0' : (Math.random() < 0.5 ? '#c5a0ff' : '#ffe0a0'),
          phase: Math.random() * Math.PI * 2,
          delay: Math.random() * 0.8 + 1.6
        });
      }

      // Floating Sky Lanterns (Đèn lồng trời bay bổng - Tangled style)
      lanterns.length = 0;
      for (let i = 0; i < 13; i++) {
        const isFar = i < 4;
        const isNear = i >= 9;
        lanterns.push({
          x: Math.random() * W,
          y: Math.random() * H * 1.2,
          size: isFar ? (Math.random() * 2.5 + 3.5) : (isNear ? (Math.random() * 3.5 + 8.5) : (Math.random() * 2.8 + 5.5)),
          speed: isFar ? (Math.random() * 0.12 + 0.10) : (isNear ? (Math.random() * 0.18 + 0.24) : (Math.random() * 0.16 + 0.15)),
          drift: (Math.random() - 0.5) * 0.11,
          wobblePhase: Math.random() * Math.PI * 2,
          wobbleSpeed: Math.random() * 0.0016 + 0.0008,
          glowPhase: Math.random() * Math.PI * 2,
          alpha: isFar ? (Math.random() * 0.22 + 0.42) : (isNear ? (Math.random() * 0.20 + 0.80) : (Math.random() * 0.22 + 0.60)),
          hue: Math.random() < 0.7 ? 38 : (Math.random() < 0.5 ? 24 : 345) // warm gold, honey amber, blush rose
        });
      }

      // Aurora borealis wave ribbons (Dải cực quang huyền diệu)
      auroraWaves.length = 0;
      const aHues = [330, 275, 195, 160]; // rose, royal purple, celestial blue, emerald teal
      for (let i = 0; i < 4; i++) {
        auroraWaves.push({
          yBase: H * (0.07 + i * 0.055),
          amplitude: 16 + Math.random() * 22,
          freq: 0.0018 + Math.random() * 0.0018,
          speed: 0.00032 + Math.random() * 0.0002,
          alpha: 0.022 + Math.random() * 0.018,
          width: H * (0.09 + Math.random() * 0.06),
          hue: aHues[i]
        });
      }

      // Floating water lotus lanterns on the lake (Hoa đăng trên mặt hồ)
      waterLanterns.length = 0;
      const wlY = [0.28, 0.52, 0.78];
      for (let i = 0; i < 3; i++) {
        waterLanterns.push({
          x: W * (0.22 + i * 0.28 + (Math.random() - 0.5) * 0.1),
          yFrac: wlY[i],
          size: 5.5 + i * 1.5,
          speed: 0.00075 + Math.random() * 0.0005,
          phase: Math.random() * Math.PI * 2,
          flamePhase: Math.random() * Math.PI * 2

      // Bioluminescent Lunar Moths (Bươm bướm đêm dạ quang)
      lunarMoths.length = 0;
      for (let i = 0; i < 2; i++) {
        lunarMoths.push({
          x: W * 0.5 + (i === 0 ? -85 : 85),
          y: H * 0.65,
          wingPhase: Math.random() * Math.PI * 2,

          baseSize: 4.8 + i * 0.6,
          hue: i === 0 ? 192 : 325 // celestial cyan & fairy rose
        });
      }
    }

    function spawnShootingStar() {

    function spawnSparkleBurst(cx, cy, count = 42) {
      const palette = ['#ffb3d1', '#ff66a3', '#fff4b8', '#a6e3ff', '#ffffff'];
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3.2 + 0.5;
        sparkles.push({
          x: cx + (Math.random() - 0.5) * 90,

          vx: Math.cos(ang) * spd * 0.75,
          vy: Math.sin(ang) * spd - Math.random() * 1.4,
          r: Math.random() * 2.6 + 1.0,
          color: palette[Math.floor(Math.random() * palette.length)],
          alpha: 1,
          decay: Math.random() * 0.014 + 0.008
        });
      }
    }

    // Render real curved petal meshes once per bloom stage, then reuse the
    // transparent sprites in the original canvas scene. No external 3D library.
    const tulipRenderer = (() => {
      const surface = document.createElement('canvas');
      surface.width = surface.height = 256;
      const gl = surface.getContext('webgl', { alpha: true, antialias: true,
        premultipliedAlpha: false, preserveDrawingBuffer: true });
      if (!gl) return null;
      try {
        function shader(type, source) {
          const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Petal shader');
          return s;
        }
        const program = gl.createProgram();
        gl.attachShader(program, shader(gl.VERTEX_SHADER, `
          attribute vec3 aPosition; attribute vec3 aNormal; attribute vec2 aUV;
          uniform float uTurn; varying vec3 vNormal; varying vec3 vPosition; varying vec2 vUV;
          void main() {
            float c=cos(uTurn), s=sin(uTurn);
            mat3 turn=mat3(c,0.,-s, 0.,1.,0., s,0.,c);
            mat3 tilt=mat3(1.,0.,0., 0.,.978,.208, 0.,-.208,.978);
            vec3 p=tilt*turn*aPosition;
            vNormal=tilt*turn*aNormal; vPosition=p; vUV=aUV;
            gl_Position=vec4(p.x/1.02,(p.y-.78)/1.02,-p.z*.24,1.);
          }`));
        gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
          precision mediump float;
          varying vec3 vNormal; varying vec3 vPosition; varying vec2 vUV;
          uniform vec3 uColor;
          void main() {
            vec3 n=normalize(vNormal);
            if(n.z<0.) n=-n;
            vec3 light=normalize(vec3(-.7,1.15,1.6));
            float diffuse=max(dot(n,light),0.);
            float edge=pow(abs(vUV.x),6.);
            float vein=sin(vUV.x*53.+sin(vUV.y*8.)*.55)*.5+.5;
            float fiber=sin(vUV.x*177.+vUV.y*11.)*.5+.5;
            vec3 base=mix(uColor*.48,uColor,smoothstep(0.,.44,vUV.y));
            base=mix(base,vec3(1.,.79,.82),smoothstep(.62,1.,vUV.y)*.38);
            base*=1.-vein*.035-fiber*.015;
            float spec=pow(max(dot(n,normalize(light+vec3(0.,0.,1.))),0.),35.);
            float rim=pow(1.-max(n.z,0.),3.);

    function drawRosePetal(ctx, x, y, size, rot, alpha, colorType) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;
      const colors = [
        ['#ffb3c6','#e8527a','#c41e56'],  // pink
        ['#f4889a','#d63b6e','#a01845'],  // rose
        ['#ffd1dc','#f2a0b5','#d6728e']   // blush
      ];
      const [tip, mid, base] = colors[colorType] || colors[0];
      const pg = ctx.createRadialGradient(-size*0.2, -size*0.1, 0, 0, 0, size*1.2);
      pg.addColorStop(0, tip);
      pg.addColorStop(0.5, mid);
      pg.addColorStop(1, base);
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.bezierCurveTo(-size*0.8, -size*0.6, -size*0.9, size*0.3, 0, size*0.7);
      ctx.bezierCurveTo(size*0.9, size*0.3, size*0.8, -size*0.6, 0, -size);
      ctx.fill();
      // Subtle vein
      ctx.strokeStyle = `rgba(255,255,255,${alpha*0.25})`;
      ctx.lineWidth = 0.3;
      ctx.beginPath();
      ctx.moveTo(0, -size*0.7);
      ctx.quadraticCurveTo(size*0.05, 0, 0, size*0.5);
      ctx.stroke();
      ctx.restore();
    }

    function drawWildflower(ctx, x, baseY, flower, elapsed, time) {
      const t = clamp01((elapsed - flower.delay) / 0.6);
      if (t <= 0) return;
      const g = easeOutCubic(t);
      const sway = Math.sin(time * 0.002 + flower.phase) * 2 * g;

      // Stem
      const stemTop = baseY - flower.stemH * g;
      ctx.strokeStyle = '#2a6e3f';
      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.quadraticCurveTo(x + sway * 0.5, (baseY + stemTop) * 0.5, x + sway, stemTop);
      ctx.stroke();

      // Petals
      ctx.save();
      ctx.translate(x + sway, stemTop);
      const bloom = easeOutBack(t);
      const petalSize = flower.size * bloom;
      for (let i = 0; i < flower.petalCount; i++) {
        const angle = (i / flower.petalCount) * Math.PI * 2 + Math.sin(time * 0.001) * 0.05;
        ctx.save();
        ctx.rotate(angle);
        ctx.fillStyle = flower.color;
        ctx.globalAlpha = 0.7 * g;
        ctx.beginPath();
        ctx.ellipse(0, -petalSize * 1.2, petalSize * 0.45, petalSize * 1.1, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // Center dot
      ctx.fillStyle = '#ffe680';
      ctx.globalAlpha = 0.9 * g;
      ctx.beginPath();
      ctx.arc(0, 0, petalSize * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function animate(time) {
      // Smooth parallax interpolation
      mouseX += (targetMX - mouseX) * 0.03;
      mouseY += (targetMY - mouseY) * 0.03;
      const px = (mouseX - 0.5) * 2; // -1 to 1
      const py = (mouseY - 0.5) * 2;

      // Premium deep sky with warm undertones
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#020510');
      skyGrad.addColorStop(0.12, '#080c24');
      skyGrad.addColorStop(0.3, '#0b1538');
      skyGrad.addColorStop(0.5, '#10224a');
      skyGrad.addColorStop(0.68, '#152d56');
      skyGrad.addColorStop(0.82, '#183560');
      skyGrad.addColorStop(1, '#1c3c6a');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      // Warm purple atmosphere
      const warmTint = ctx.createRadialGradient(W*0.75, H*0.1, 0, W*0.75, H*0.1, Math.max(W,H)*0.5);
      warmTint.addColorStop(0, 'rgba(65,25,85,0.07)');
      warmTint.addColorStop(0.5, 'rgba(40,15,55,0.035)');
      warmTint.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = warmTint; ctx.fillRect(0,0,W,H);

      // Secondary rose-tinted atmosphere (for 20/10)
      const roseTint = ctx.createRadialGradient(W*0.5, H*0.65, 0, W*0.5, H*0.65, Math.max(W,H)*0.6);
      roseTint.addColorStop(0, 'rgba(80,20,45,0.04)');
      roseTint.addColorStop(0.5, 'rgba(50,10,30,0.02)');
      roseTint.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = roseTint; ctx.fillRect(0,0,W,H);

      // === AURORA BOREALIS (DẢI CỰC QUANG HUYỀN DIỆU) ===
      for (const aw of auroraWaves) {
        ctx.save();
        const auroraAlpha = aw.alpha * (0.65 + 0.35 * Math.sin(time * 0.00045 + aw.hue));
        ctx.globalAlpha = auroraAlpha;
        ctx.globalCompositeOperation = 'screen';

        const aGrad = ctx.createLinearGradient(0, aw.yBase - aw.width * 0.5, 0, aw.yBase + aw.width * 0.5);
        const h = aw.hue;
        aGrad.addColorStop(0, `hsla(${h}, 70%, 55%, 0)`);
        aGrad.addColorStop(0.25, `hsla(${h}, 75%, 62%, 0.4)`);
        aGrad.addColorStop(0.5, `hsla(${h}, 80%, 68%, 0.75)`);
        aGrad.addColorStop(0.75, `hsla(${h}, 75%, 62%, 0.4)`);
        aGrad.addColorStop(1, `hsla(${h}, 70%, 55%, 0)`);

        ctx.fillStyle = aGrad;
        ctx.beginPath();
        ctx.moveTo(0, aw.yBase + aw.width * 0.5);
        for (let ax = 0; ax <= W; ax += 12) {
          const wave1 = Math.sin(ax * aw.freq + time * aw.speed) * aw.amplitude;
          const wave2 = Math.sin(ax * aw.freq * 1.6 + time * aw.speed * 0.7 + 2) * (aw.amplitude * 0.45);
          const wave3 = Math.sin(ax * aw.freq * 0.5 + time * aw.speed * 1.2) * (aw.amplitude * 0.55);
          ctx.lineTo(ax, aw.yBase - aw.width * 0.5 + wave1 + wave2 + wave3);
        }
        ctx.lineTo(W, aw.yBase + aw.width * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Horizon glow (warm amber-rose at the base)
      const horizGlow = ctx.createLinearGradient(0, H*0.6, 0, H*0.78);
      horizGlow.addColorStop(0, 'rgba(0,0,0,0)');
      horizGlow.addColorStop(0.5, 'rgba(35,18,45,0.06)');
      horizGlow.addColorStop(1, 'rgba(60,25,40,0.04)');
      ctx.fillStyle = horizGlow; ctx.fillRect(0,0,W,H);

      // === CRESCENT MOON === (with parallax)
      const moonX = W * 0.17 + px * 8, moonY = H * 0.12 + py * 5, moonR = Math.min(34, W * 0.075);
      const moonPulse = 1 + Math.sin(time * 0.0008) * 0.04;

      // Soft light rays emanating from moon
      ctx.save();
      ctx.globalAlpha = 0.025 + Math.sin(time * 0.0006) * 0.008;
      for (let i = 0; i < 6; i++) {
        const rayAngle = (i / 6) * Math.PI * 2 + time * 0.00008;
        const rayLen = moonR * (5 + Math.sin(time * 0.001 + i * 1.5) * 1.5);
        const rayW = moonR * 0.6;
        ctx.save();
        ctx.translate(moonX, moonY);
        ctx.rotate(rayAngle);
        const rayGrad = ctx.createLinearGradient(0, 0, rayLen, 0);
        rayGrad.addColorStop(0, 'rgba(230,235,250,0.5)');
        rayGrad.addColorStop(0.4, 'rgba(200,215,240,0.2)');
        rayGrad.addColorStop(1, 'rgba(160,180,220,0)');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(moonR * 0.6, 0);
        ctx.lineTo(rayLen, -rayW * 0.15);
        ctx.lineTo(rayLen, rayW * 0.15);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();

      // Outer halo layers (pulsing, bounded to circle for 90%+ less fillrate)
      const h3R = moonR * 5.2 * moonPulse;
      const halo3 = ctx.createRadialGradient(moonX, moonY, moonR * 0.8, moonX, moonY, h3R);
      halo3.addColorStop(0, 'rgba(200,215,240,0.035)');
      halo3.addColorStop(0.35, 'rgba(160,185,225,0.015)');
      halo3.addColorStop(1, 'rgba(100,140,200,0)');
      ctx.fillStyle = halo3;
      ctx.beginPath(); ctx.arc(moonX, moonY, h3R, 0, Math.PI * 2); ctx.fill();

      const h2R = moonR * 3.2 * moonPulse;
      const halo2 = ctx.createRadialGradient(moonX, moonY, moonR * 0.4, moonX, moonY, h2R);
      halo2.addColorStop(0, 'rgba(225,233,250,0.07)');
      halo2.addColorStop(0.5, 'rgba(185,205,238,0.025)');
      halo2.addColorStop(1, 'rgba(130,160,210,0)');
      ctx.fillStyle = halo2;
      ctx.beginPath(); ctx.arc(moonX, moonY, h2R, 0, Math.PI * 2); ctx.fill();

      const h1R = moonR * 1.9;
      const halo1 = ctx.createRadialGradient(moonX, moonY, moonR * 0.2, moonX, moonY, h1R);
      halo1.addColorStop(0, 'rgba(245,248,255,0.16)');
      halo1.addColorStop(0.5, 'rgba(210,220,245,0.05)');
      halo1.addColorStop(1, 'rgba(160,180,220,0)');
      ctx.fillStyle = halo1;
      ctx.beginPath(); ctx.arc(moonX, moonY, h1R, 0, Math.PI * 2); ctx.fill();

      // Moon body (crescent)
      ctx.save();
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, Math.PI*2);
      ctx.arc(moonX + moonR*0.42, moonY - moonR*0.12, moonR*0.8, 0, Math.PI*2, true);
      ctx.clip();

      // Surface gradient with warm tones
      const moonGrad = ctx.createRadialGradient(moonX - moonR*0.22, moonY - moonR*0.22, moonR*0.08, moonX, moonY, moonR);
      moonGrad.addColorStop(0, '#faf6ec');
      moonGrad.addColorStop(0.25, '#f0eadb');
      moonGrad.addColorStop(0.55, '#e2d9c5');
      moonGrad.addColorStop(0.8, '#d4cab2');
      moonGrad.addColorStop(1, '#c0b598');
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR, 0, Math.PI*2);
      ctx.fill();

      // Mare (dark regions)
      ctx.globalAlpha = 0.06;
      ctx.fillStyle = '#8a8068';
      ctx.beginPath(); ctx.arc(moonX - moonR*0.28, moonY + moonR*0.12, moonR*0.14, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(moonX - moonR*0.08, moonY - moonR*0.28, moonR*0.09, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(moonX - moonR*0.38, moonY - moonR*0.18, moonR*0.07, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.04;
      ctx.beginPath(); ctx.arc(moonX - moonR*0.15, moonY + moonR*0.32, moonR*0.1, 0, Math.PI*2); ctx.fill();

      // Lit edge highlight
      ctx.globalAlpha = 0.12;
      ctx.strokeStyle = '#fff8e8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(moonX, moonY, moonR - 0.5, -Math.PI * 0.4, Math.PI * 0.6);
      ctx.stroke();
      ctx.restore();

      // Moonlight cast onto the whole scene
      const moonlight = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, Math.max(W,H)*0.65);
      moonlight.addColorStop(0, 'rgba(195,210,235,0.065)');
      moonlight.addColorStop(0.25, 'rgba(140,170,210,0.03)');
      moonlight.addColorStop(0.6, 'rgba(80,110,160,0.01)');
      moonlight.addColorStop(1, 'rgba(10,20,40,0)');
      ctx.fillStyle = moonlight; ctx.fillRect(0,0,W,H);

      // === STARS ===
      for (const s of stars) {
        const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
        const a = s.alpha * tw;

        if (s.isBright) {
          // Cross-sparkle with soft 45° diagonals
          const sparkLen = s.r * (3.2 + Math.sin(time * 0.002 + s.phase) * 0.8);
          const sparkAlpha = a * 0.5;
          const col = s.hue > 100 ? '200,220,255' : '255,240,200';
          ctx.strokeStyle = `rgba(${col},${sparkAlpha})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(s.x - sparkLen, s.y); ctx.lineTo(s.x + sparkLen, s.y);
          ctx.moveTo(s.x, s.y - sparkLen); ctx.lineTo(s.x, s.y + sparkLen);
          ctx.stroke();
          // Subtle diagonal cross
          const dLen = sparkLen * 0.55;
          ctx.globalAlpha = sparkAlpha * 0.4;
          ctx.beginPath();
          ctx.moveTo(s.x - dLen, s.y - dLen); ctx.lineTo(s.x + dLen, s.y + dLen);
          ctx.moveTo(s.x + dLen, s.y - dLen); ctx.lineTo(s.x - dLen, s.y + dLen);
          ctx.stroke();
          ctx.globalAlpha = 1;

          // Outer soft glow (fast, no shadowBlur)
          ctx.fillStyle = `rgba(${col},${a * 0.25})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 2.4, 0, Math.PI * 2);
          ctx.fill();

          // Bright star core
          ctx.fillStyle = `rgba(${col},${a})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(228, 238, 255, ${a})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // === FALLING ROSE PETALS ===
      for (const p of petals) {
        p.x += p.vx + Math.sin(time * p.wobbleSpeed + p.wobblePhase) * 0.4;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        // Reset when off screen
        if (p.y > H * 0.75) {
          p.y = -p.size * 3;
          p.x = Math.random() * W;
        }
        drawRosePetal(ctx, p.x, p.y, p.size, p.rot, p.alpha, p.color);
      }

      // === WISPY CLOUDS ===
      for (const c of clouds) {
        c.x += c.speed;
        if (c.x > W + c.w) c.x = -c.w;
        if (c.x < -c.w) c.x = W + c.w;

        ctx.save();
        ctx.globalAlpha = c.alpha;
        const cg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.w * 0.5);
        cg.addColorStop(0, 'rgba(175,195,225,0.45)');
        cg.addColorStop(0.35, 'rgba(145,168,205,0.25)');
        cg.addColorStop(1, 'rgba(100,130,170,0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.w * 0.5, c.h, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(c.x + c.w * 0.2, c.y - c.h * 0.35, c.w * 0.32, c.h * 0.75, 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(c.x - c.w * 0.15, c.y + c.h * 0.2, c.w * 0.28, c.h * 0.6, -0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (Math.random() < 0.022 && shootingStars.length < 2) {
        spawnShootingStar();
      }
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const st = shootingStars[i];
        st.x += st.vx;
        st.y += st.vy;
        st.life -= st.decay;
        if (st.life <= 0) {
          shootingStars.splice(i, 1);
          continue;
        }
        const tx = st.x - st.vx * (st.len / 9);
        const ty = st.y - st.vy * (st.len / 9);
        const g = ctx.createLinearGradient(st.x, st.y, tx, ty);
        g.addColorStop(0, `rgba(255, 255, 255, ${st.life})`);
        g.addColorStop(0.3, `rgba(165, 230, 255, ${st.life * 0.75})`);
        g.addColorStop(1, 'rgba(155, 220, 255, 0)');
        ctx.strokeStyle = g;
        ctx.lineWidth = 2.0;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(tx, ty);
        ctx.stroke();
      }

      // === FLOATING SKY LANTERNS (ĐÈN LỒNG TRỜI BAY BỔNG - TANGLED STYLE) ===
      for (const l of lanterns) {
        l.y -= l.speed;
        l.x += l.drift + Math.sin(time * l.wobbleSpeed + l.wobblePhase) * 0.28;
        if (l.y < -l.size * 5) {
          l.y = H + l.size * 2;
          l.x = Math.random() * W;
        }

        const depthFactor = l.size / 10;
        const lx = (l.x + px * depthFactor * 16 + W) % W;
        const ly = l.y + py * depthFactor * 10;

        const flicker = 0.88 + 0.12 * Math.sin(time * 0.0032 + l.glowPhase);
        const lAlpha = l.alpha;

        ctx.save();
        if (l.size <= 5.0) {
          // Fast distant lantern: glowing core + warm halo without radial gradients
          ctx.fillStyle = `hsla(${l.hue}, 95%, 68%, ${lAlpha * 0.35 * flicker})`;
          ctx.beginPath();
          ctx.arc(lx, ly, l.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `hsla(${l.hue + 8}, 95%, 85%, ${lAlpha * flicker})`;
          ctx.beginPath();
          ctx.arc(lx, ly, l.size * 0.75, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          continue;
        }

        // 1. Warm outer corona glow
        const glowR = l.size * 3.6;
        const radGlow = ctx.createRadialGradient(lx, ly, l.size * 0.2, lx, ly, glowR);
        radGlow.addColorStop(0, `hsla(${l.hue}, 95%, 68%, ${lAlpha * 0.42 * flicker})`);
        radGlow.addColorStop(0.35, `hsla(${l.hue - 8}, 90%, 56%, ${lAlpha * 0.16 * flicker})`);
        radGlow.addColorStop(0.7, `hsla(${l.hue - 15}, 85%, 45%, ${lAlpha * 0.04 * flicker})`);
        radGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = radGlow;
        ctx.beginPath();
        ctx.arc(lx, ly, glowR, 0, Math.PI * 2);
        ctx.fill();

        // 2. Lantern paper body (subtle rounded trapezoid)
        const lw = l.size * 0.95;
        const lh = l.size * 1.35;
        const tilt = Math.sin(time * l.wobbleSpeed + l.wobblePhase) * 0.08;

        ctx.translate(lx, ly);
        ctx.rotate(tilt);

        const bodyGrad = ctx.createLinearGradient(0, -lh * 0.5, 0, lh * 0.5);
        bodyGrad.addColorStop(0, `hsla(${l.hue + 6}, 90%, 78%, ${lAlpha * 0.88})`);
        bodyGrad.addColorStop(0.35, `hsla(${l.hue}, 95%, 68%, ${lAlpha * 0.95})`);
        bodyGrad.addColorStop(0.75, `hsla(${l.hue - 12}, 100%, 52%, ${lAlpha * 0.98})`);
        bodyGrad.addColorStop(1, `hsla(${l.hue - 20}, 95%, 38%, ${lAlpha * 0.92})`);

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.moveTo(-lw * 0.42, -lh * 0.5);
        ctx.quadraticCurveTo(0, -lh * 0.56, lw * 0.42, -lh * 0.5);
        ctx.quadraticCurveTo(lw * 0.58, 0, lw * 0.48, lh * 0.46);
        ctx.quadraticCurveTo(0, lh * 0.52, -lw * 0.48, lh * 0.46);
        ctx.quadraticCurveTo(-lw * 0.58, 0, -lw * 0.42, -lh * 0.5);
        ctx.closePath();
        ctx.fill();

        // 3. Delicate bamboo rib lines (for medium/large lanterns)
        if (l.size > 5.5) {
          ctx.strokeStyle = `rgba(255, 235, 180, ${lAlpha * 0.35})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(0, -lh * 0.52);
          ctx.lineTo(0, lh * 0.48);
          ctx.moveTo(-lw * 0.24, -lh * 0.5);
          ctx.quadraticCurveTo(-lw * 0.28, 0, -lw * 0.26, lh * 0.46);
          ctx.moveTo(lw * 0.24, -lh * 0.5);
          ctx.quadraticCurveTo(lw * 0.28, 0, lw * 0.26, lh * 0.46);
          ctx.stroke();
        }

        // 4. Inner bright candle flame at base
        const flameR = l.size * 0.36;
        const flameGrad = ctx.createRadialGradient(0, lh * 0.28, 0, 0, lh * 0.28, flameR);
        flameGrad.addColorStop(0, `rgba(255, 255, 245, ${lAlpha * flicker})`);
        flameGrad.addColorStop(0.45, `rgba(255, 225, 120, ${lAlpha * 0.85 * flicker})`);
        flameGrad.addColorStop(0.85, `rgba(255, 140, 30, ${lAlpha * 0.4 * flicker})`);
        flameGrad.addColorStop(1, 'rgba(255, 80, 10, 0)');
        ctx.fillStyle = flameGrad;
        ctx.beginPath();
        ctx.arc(0, lh * 0.28, flameR, 0, Math.PI * 2);
        ctx.fill();

        // 5. Dark wooden/bamboo bottom rim
        ctx.strokeStyle = `rgba(60, 24, 10, ${lAlpha * 0.65})`;
        ctx.lineWidth = Math.max(0.6, l.size * 0.08);
        ctx.beginPath();
        ctx.ellipse(0, lh * 0.47, lw * 0.46, l.size * 0.1, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      if (appState !== 'HOLD') {
        const elapsed = (performance.now() - growStartTime) / 1000;
        const landAlpha = clamp01(elapsed / 0.65);

        ctx.save();
        ctx.globalAlpha = landAlpha;

        const horizonY = H * 0.72;

        // Distant hills with moonlight edge
        const hill1Grad = ctx.createLinearGradient(0, horizonY - 50, 0, horizonY + 30);
        hill1Grad.addColorStop(0, '#0c2650');
        hill1Grad.addColorStop(0.6, '#0a224a');
        hill1Grad.addColorStop(1, '#081d3e');
        ctx.fillStyle = hill1Grad;
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, horizonY - 8);
        ctx.bezierCurveTo(W * 0.22, horizonY - 48, W * 0.52, horizonY + 14, W, horizonY - 28);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        // Moonlight on hill ridge
        ctx.save();
        ctx.globalAlpha = 0.06;
        ctx.strokeStyle = '#a0b8d8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, horizonY - 8);
        ctx.bezierCurveTo(W * 0.22, horizonY - 48, W * 0.52, horizonY + 14, W, horizonY - 28);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#061733';
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, horizonY + 16);
        ctx.bezierCurveTo(W * 0.34, horizonY + 38, W * 0.66, horizonY - 18, W, horizonY + 12);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        // === SERENE REFLECTIVE LAKE (MẶT HỒ PHẢN CHIẾU ÁNH TRĂNG) ===
        const lakeTopY = horizonY + 10;
        const lakeBottomY = H - 55;

        // 1. Deep midnight water surface
        const lakeGrad = ctx.createLinearGradient(0, lakeTopY, 0, lakeBottomY);
        lakeGrad.addColorStop(0, '#041026');
        lakeGrad.addColorStop(0.28, '#06173a');
        lakeGrad.addColorStop(0.65, '#071f45');
        lakeGrad.addColorStop(1, '#05142b');
        ctx.fillStyle = lakeGrad;
        ctx.beginPath();
        ctx.moveTo(0, lakeTopY);
        ctx.lineTo(W, lakeTopY);
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.closePath();
        ctx.fill();

        // 2. Wide moonlight path / silver reflection column
        const moonColGrad = ctx.createRadialGradient(moonX, lakeTopY + 45, 10, moonX, lakeTopY + 45, Math.max(W * 0.35, 240));
        moonColGrad.addColorStop(0, 'rgba(215, 235, 255, 0.18)');
        moonColGrad.addColorStop(0.25, 'rgba(165, 205, 245, 0.09)');
        moonColGrad.addColorStop(0.65, 'rgba(110, 160, 220, 0.025)');
        moonColGrad.addColorStop(1, 'rgba(10, 25, 60, 0)');
        ctx.fillStyle = moonColGrad;
        ctx.fillRect(0, lakeTopY, W, H - lakeTopY);

        // 3. Wavering inverted reflections of floating sky lanterns on water
        for (const l of lanterns) {
          if (l.y < horizonY && l.size > 4.5) {
            const depthFactor = l.size / 10;
            const lx = (l.x + px * depthFactor * 16 + W) % W;
            const distAbove = horizonY - l.y;
            const refY = lakeTopY + distAbove * 0.28;
            if (refY > lakeTopY && refY < lakeBottomY) {
              const refW = l.size * (1.6 + Math.sin(time * 0.003 + l.glowPhase) * 0.3);
              const refH = l.size * 0.55;
              const flicker = 0.85 + 0.15 * Math.sin(time * 0.0035 + l.glowPhase);
              const refAlpha = l.alpha * 0.16 * flicker * (1 - (refY - lakeTopY) / (lakeBottomY - lakeTopY));

              ctx.fillStyle = `hsla(${l.hue}, 95%, 68%, ${refAlpha})`;
              ctx.beginPath();
              ctx.ellipse(lx, refY, refW, refH, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // 4. Shimmering silver water ripples (horizontal perspective lines)
        ctx.save();
        const rippleCount = 14;
        for (let ri = 0; ri < rippleCount; ri++) {
          const rFrac = ri / rippleCount;
          const ry = lakeTopY + Math.pow(rFrac, 1.35) * (lakeBottomY - lakeTopY);
          const ripW = (0.2 + 0.8 * rFrac) * W * 0.28;
          const sway = Math.sin(time * 0.0022 + ri * 0.7) * (3 + ri * 0.5);
          const ripCenterX = moonX + sway;

          const ripOsc = 0.45 + 0.55 * Math.sin(time * 0.003 + ri * 1.1);
          const ripAlpha = (0.04 + 0.16 * (1 - rFrac * 0.4)) * ripOsc;

          ctx.strokeStyle = `rgba(225, 240, 255, ${ripAlpha * 0.85})`;
          ctx.lineWidth = 0.8 + rFrac * 1.0;
          ctx.beginPath();
          ctx.moveTo(ripCenterX - ripW, ry);
          ctx.quadraticCurveTo(ripCenterX, ry + Math.sin(time * 0.004 + ri) * 1.2, ripCenterX + ripW, ry);
          ctx.stroke();
        }
        ctx.restore();

        // 5. Lake Mist Wisps (Dải sương mù mờ ảo trên mặt hồ)
        ctx.save();
        for (let mi = 0; mi < 2; mi++) {
          const my = lakeTopY + 16 + mi * 24;
          const mx = ((time * 0.010 * (mi === 0 ? 1 : -0.75) + mi * W * 0.5) % (W * 1.5)) - W * 0.25;
          const mg = ctx.createRadialGradient(mx, my, 0, mx, my, W * 0.36);
          mg.addColorStop(0, 'rgba(175, 208, 238, 0.048)');
          mg.addColorStop(0.5, 'rgba(120, 165, 210, 0.022)');
          mg.addColorStop(1, 'rgba(80, 120, 160, 0)');
          ctx.fillStyle = mg;
          ctx.beginPath();
          ctx.ellipse(mx, my, W * 0.38, 14, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 6. Floating Water Lotus Lanterns (Hoa đăng trôi lững lờ trên mặt hồ)
        for (const wl of waterLanterns) {
          const bob = Math.sin(time * wl.speed + wl.phase) * 12;
          const wx = wl.x + bob;
          const wy = lakeTopY + wl.yFrac * (lakeBottomY - lakeTopY);
          const fFlicker = 0.85 + 0.15 * Math.sin(time * 0.0038 + wl.flamePhase);

          ctx.save();
          // Lotus lantern water reflection
          const refG = ctx.createRadialGradient(wx, wy + wl.size * 0.7, 0, wx, wy + wl.size * 0.7, wl.size * 2.2);
          refG.addColorStop(0, `rgba(255, 195, 100, ${0.45 * fFlicker})`);
          refG.addColorStop(0.4, `rgba(255, 140, 50, ${0.18 * fFlicker})`);
          refG.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = refG;
          ctx.beginPath();
          ctx.ellipse(wx, wy + wl.size * 0.7, wl.size * 2.2, wl.size * 0.65, 0, 0, Math.PI * 2);
          ctx.fill();

          // Water ripple ring around lantern
          ctx.strokeStyle = `rgba(200, 225, 255, ${0.12 * fFlicker})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.ellipse(wx, wy + wl.size * 0.35, wl.size * 1.5, wl.size * 0.45, 0, 0, Math.PI * 2);
          ctx.stroke();

          // Lotus petals base (soft pink & cream)
          ctx.fillStyle = 'rgba(255, 190, 210, 0.85)';
          ctx.beginPath();
          ctx.ellipse(wx, wy + wl.size * 0.2, wl.size * 1.3, wl.size * 0.42, 0, 0, Math.PI * 2);
          ctx.fill();

          // Inner gold candle flame
          const flameR = wl.size * 0.45;
          const flameG = ctx.createRadialGradient(wx, wy - wl.size * 0.15, 0, wx, wy - wl.size * 0.15, flameR);
          flameG.addColorStop(0, `rgba(255, 255, 240, ${0.98 * fFlicker})`);
          flameG.addColorStop(0.45, `rgba(255, 210, 80, ${0.85 * fFlicker})`);
          flameG.addColorStop(0.85, `rgba(255, 110, 20, ${0.35 * fFlicker})`);
          flameG.addColorStop(1, 'rgba(255, 70, 10, 0)');
          ctx.fillStyle = flameG;
          ctx.beginPath();
          ctx.arc(wx, wy - wl.size * 0.15, flameR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 7. Shoreline soft luminous water edge
        ctx.save();
        ctx.strokeStyle = 'rgba(150, 190, 230, 0.09)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, lakeTopY);
        ctx.lineTo(W, lakeTopY);
        ctx.stroke();
        ctx.restore();

        const moundGrad = ctx.createLinearGradient(0, H - 140, 0, H);
        moundGrad.addColorStop(0, '#0c2e28');
        moundGrad.addColorStop(0.4, '#071e1a');
        moundGrad.addColorStop(0.7, '#041210');
        moundGrad.addColorStop(1, '#020a0c');
        ctx.fillStyle = moundGrad;
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, H - 68);
        ctx.quadraticCurveTo(W * 0.5, H - 138, W, H - 68);
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        for (const b of grassBlades) {
          if (b.layer > 0) continue;
          const sway = Math.sin(time * b.speed + b.phase) * 9;
          const baseY = H - 8 - Math.sin((b.x / W) * Math.PI) * 32;
          const tipX = b.x + b.curve + sway;
          const tipY = baseY - b.h * easeOutCubic(elapsed / 0.7);
          ctx.fillStyle = '#0a2621';
          ctx.beginPath();
          ctx.moveTo(b.x - b.w, baseY + 14);
          ctx.quadraticCurveTo(b.x, baseY - b.h * 0.5, tipX, tipY);
          ctx.quadraticCurveTo(b.x + b.w * 0.5, baseY - b.h * 0.45, b.x + b.w, baseY + 14);
          ctx.closePath();
          ctx.fill();
        }

        drawBouquet(ctx, time, elapsed);

        const grassG1 = ctx.createLinearGradient(0, H, 0, H - 95);
        grassG1.addColorStop(0, '#041212');
        grassG1.addColorStop(0.65, '#174736');
        grassG1.addColorStop(1, '#39855d');

        const grassG2 = ctx.createLinearGradient(0, H, 0, H - 115);
        grassG2.addColorStop(0, '#061a18');
        grassG2.addColorStop(0.6, '#236647');
        grassG2.addColorStop(1, '#6cc482');

        for (const b of grassBlades) {
          if (b.layer === 0) continue;
          const sway = Math.sin(time * b.speed + b.phase) * 11;
          const baseY = H - 6 - Math.sin((b.x / W) * Math.PI) * 28;
          const curH = b.h * easeOutCubic(elapsed / 0.75);
          const tipX = b.x + b.curve + sway;
          const tipY = baseY - curH;

          ctx.fillStyle = b.layer === 1 ? grassG1 : grassG2;
          ctx.beginPath();
          ctx.moveTo(b.x - b.w, baseY + 14);
          ctx.quadraticCurveTo(b.x, baseY - curH * 0.5, tipX, tipY);
          ctx.quadraticCurveTo(b.x + b.w * 0.5, baseY - curH * 0.45, b.x + b.w, baseY + 14);
          ctx.closePath();
          ctx.fill();
        }

        // Wildflowers in the grass
        for (const wf of wildflowers) {
          const baseY = H - 6 - Math.sin((wf.x / W) * Math.PI) * 28;
          drawWildflower(ctx, wf.x, baseY, wf, elapsed, time);
        }

        // Fireflies with soft trail
        for (const f of fireflies) {
          f.x += f.vx + Math.sin(time * 0.0012 + f.phase) * 0.22;
          f.y += f.vy;
          if (f.y < H * 0.16) {
            f.y = H - 18;
            f.x = Math.random() * W;
            f.trail = [];
          }
          // Record trail
          f.trail.push({x: f.x, y: f.y});
          if (f.trail.length > 5) f.trail.shift();

          const a = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.0025 + f.phase));

          // Draw trail
          if (f.trail.length > 1) {
            for (let ti = 0; ti < f.trail.length - 1; ti++) {
              const trailAlpha = (ti / f.trail.length) * a * 0.22;
              ctx.fillStyle = f.isGold
                ? `rgba(255, 230, 115, ${trailAlpha})`
                : `rgba(135, 225, 255, ${trailAlpha})`;
              const trailR = f.r * (ti / f.trail.length) * 0.55;
              ctx.beginPath();
              ctx.arc(f.trail[ti].x, f.trail[ti].y, trailR, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Main firefly (fast dual-disc, zero shadowBlur cost)
          const fCol = f.isGold ? '255, 230, 115' : '135, 225, 255';
          ctx.fillStyle = `rgba(${fCol}, ${a * 0.22})`;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `rgba(${fCol}, ${a})`;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ground-level mist
        ctx.save();
        const mistY = H - 45;
        for (let mi = 0; mi < 4; mi++) {
          const mx = (W * 0.25 * mi + time * 0.015 * (mi % 2 === 0 ? 1 : -1)) % (W * 1.2) - W * 0.1;
          const mg = ctx.createRadialGradient(mx, mistY + mi * 8, 0, mx, mistY + mi * 8, W * 0.2);
          mg.addColorStop(0, `rgba(140,180,200,${0.035 - mi * 0.005})`);
          mg.addColorStop(0.6, `rgba(100,140,170,${0.015 - mi * 0.002})`);
          mg.addColorStop(1, 'rgba(80,120,150,0)');
          ctx.fillStyle = mg;
          ctx.fillRect(0, mistY - 30, W, 80);
        }
        ctx.restore();

        // Bioluminescent Lunar Moths (Bươm bướm đêm dạ quang dập dờn quanh hoa)
        if (elapsed > 1.35) {
          const mothAlpha = clamp01((elapsed - 1.35) / 0.85);
          const bCenterX = W * 0.5;
          const bCenterY = H - 230;

          for (let mi = 0; mi < lunarMoths.length; mi++) {
            const m = lunarMoths[mi];
            const t = time * 0.0009 + m.flightPhase;
            const orbitX = Math.sin(t) * (115 + mi * 25);
            const orbitY = Math.sin(t * 2) * (45 + mi * 15) - 30;

            m.x = bCenterX + orbitX + px * 10;
            m.y = bCenterY + orbitY + py * 8;
            m.angle = Math.atan2(Math.cos(t * 2) * 90, Math.cos(t) * 115);

            const flap = Math.sin(time * m.wingSpeed + m.wingPhase);
            const wingOpen = Math.abs(flap) * 0.72 + 0.28;

            ctx.save();
            ctx.globalAlpha = mothAlpha;
            ctx.translate(m.x, m.y);
            ctx.rotate(m.angle);

            // Luminescent glow aura
            const mothGlow = ctx.createRadialGradient(0, 0, 1, 0, 0, m.baseSize * 3.6);
            mothGlow.addColorStop(0, `hsla(${m.hue}, 90%, 78%, 0.40)`);
            mothGlow.addColorStop(0.45, `hsla(${m.hue}, 85%, 68%, 0.12)`);
            mothGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = mothGlow;
            ctx.beginPath();
            ctx.arc(0, 0, m.baseSize * 3.6, 0, Math.PI * 2);
            ctx.fill();

            // Wing gradient
            const wingGrad = ctx.createLinearGradient(0, 0, -m.baseSize * 2.2, -m.baseSize * 1.8);
            wingGrad.addColorStop(0, 'rgba(255, 255, 255, 0.92)');
            wingGrad.addColorStop(0.35, `hsla(${m.hue}, 95%, 78%, 0.75)`);
            wingGrad.addColorStop(0.85, `hsla(${m.hue + 15}, 90%, 65%, 0.35)`);
            wingGrad.addColorStop(1, 'rgba(255, 255, 255, 0.1)');

            // Left wing pair
            ctx.save();
            ctx.scale(wingOpen, 1);
            ctx.fillStyle = wingGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-m.baseSize * 1.6, -m.baseSize * 2.5, -m.baseSize * 3.0, -m.baseSize * 1.3, 0, -m.baseSize * 0.3);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-m.baseSize * 1.3, m.baseSize * 1.6, -m.baseSize * 2.1, m.baseSize * 0.9, 0, m.baseSize * 0.4);
            ctx.fill();
            ctx.restore();

            // Right wing pair
            ctx.save();
            ctx.scale(-wingOpen, 1);
            ctx.fillStyle = wingGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-m.baseSize * 1.6, -m.baseSize * 2.5, -m.baseSize * 3.0, -m.baseSize * 1.3, 0, -m.baseSize * 0.3);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-m.baseSize * 1.3, m.baseSize * 1.6, -m.baseSize * 2.1, m.baseSize * 0.9, 0, m.baseSize * 0.4);
            ctx.fill();
            ctx.restore();

            // Slender luminescent body & delicate antennae
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, 0, 1.0, m.baseSize * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(-0.5, -m.baseSize * 0.4); ctx.quadraticCurveTo(-1.8, -m.baseSize * 0.8, -2.6, -m.baseSize * 1.1);
            ctx.moveTo(0.5, -m.baseSize * 0.4); ctx.quadraticCurveTo(1.8, -m.baseSize * 0.8, 2.6, -m.baseSize * 1.1);
            ctx.stroke();

            ctx.restore();

            // Sparkle dust trail shed from moth wings
            if (Math.random() < 0.28 && sparkles.length < 240) {
              sparkles.push({
                x: m.x + (Math.random() - 0.5) * 6,
                y: m.y + (Math.random() - 0.5) * 6,
                vx: (Math.random() - 0.5) * 0.35,
                vy: Math.random() * 0.25 + 0.1,
                r: Math.random() * 1.2 + 0.5,
                color: `hsla(${m.hue}, 95%, 82%, 0.85)`,
                alpha: 0.85,
                decay: 0.019
              });
            }
          }
        }

        ctx.restore();
      }

      for (let i = sparkles.length - 1; i >= 0; i--) {
        const p = sparkles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy -= 0.012;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          sparkles.splice(i, 1);
          continue;
        }
        const pa = Math.max(0, p.alpha);
        // Outer soft glow
        ctx.globalAlpha = pa * 0.28;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Inner bright spark
        ctx.globalAlpha = pa;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      requestAnimationFrame(animate);
    }

    const holdStage = document.getElementById('holdStage');
    const holdRing = document.getElementById('holdRing');
    const btnHold = document.getElementById('btnHold');
    const skyTitle = document.getElementById('skyTitle');
    const envelopeCard = document.getElementById('envelopeCard');
    const letterBackdrop = document.getElementById('letterBackdrop');
    const vintageLetterModal = document.getElementById('vintageLetterModal');
    const letterHeading = document.getElementById('letterHeading');
    const letterBody = document.getElementById('letterBody');

    let holdProgress = 0;
    let isHolding = false;
    let holdRAF = null;
    let sequenceTimers = [];
    let typewriterTimer = null;

    function beginHold(e) {
      if (e.type === 'touchstart') e.preventDefault();
      if (appState !== 'HOLD') return;
      startMusic();
      isHolding = true;

      function updateHold() {
        if (!isHolding || appState !== 'HOLD') return;
        holdProgress += 5.5;
        const offset = 263.9 - (Math.min(100, holdProgress) / 100) * 263.9;
        holdRing.style.strokeDashoffset = offset;
        if (Math.random() < 0.4) {
          spawnSparkleBurst(W * 0.5, H - 75, 3);
        }
        if (holdProgress >= 100) {
          isHolding = false;
          triggerBouquetGrowth();
        } else {
          holdRAF = requestAnimationFrame(updateHold);
        }
      }
      cancelAnimationFrame(holdRAF);
      holdRAF = requestAnimationFrame(updateHold);
    }

    function endHold() {
      if (appState !== 'HOLD') return;
      isHolding = false;
      if (holdProgress > 0 && holdProgress < 100) {
        function autoCompleteTap() {
          if (appState !== 'HOLD') return;
          holdProgress += 8.5;
          const offset = 263.9 - (Math.min(100, holdProgress) / 100) * 263.9;
          holdRing.style.strokeDashoffset = offset;
          if (holdProgress >= 100) {
            triggerBouquetGrowth();
          } else {
            requestAnimationFrame(autoCompleteTap);
          }
        }
        requestAnimationFrame(autoCompleteTap);
      }
    }

    btnHold.addEventListener('mousedown', beginHold);
    btnHold.addEventListener('click', (e) => {
      e.stopPropagation();
      if (appState === 'HOLD' && !isHolding) {
        startMusic();
        function fastFill() {
          if (appState !== 'HOLD') return;
          holdProgress += 9.5;
          const offset = 263.9 - (Math.min(100, holdProgress) / 100) * 263.9;
          holdRing.style.strokeDashoffset = offset;
          if (holdProgress >= 100) {
            triggerBouquetGrowth();
          } else {
            requestAnimationFrame(fastFill);
          }
        }
        requestAnimationFrame(fastFill);
      }
    });
    btnHold.addEventListener('touchstart', beginHold, { passive: false });
    window.addEventListener('mouseup', endHold);
    window.addEventListener('touchend', endHold);

    function triggerBouquetGrowth() {
      if (appState !== 'HOLD') return;
      appState = 'GROWING';
      growStartTime = performance.now();
      playSparkleChime();
      spawnSparkleBurst(W * 0.5, H - 90, 40);

      holdStage.classList.add('opacity-0', 'pointer-events-none', 'scale-90');

      sequenceTimers.push(setTimeout(() => {
        skyTitle.classList.remove('opacity-0', 'translate-y-2');
        skyTitle.classList.add('opacity-100', 'translate-y-0');
      }, 300));

      sequenceTimers.push(setTimeout(() => {
        playSparkleChime();
        spawnSparkleBurst(W * 0.5, H * 0.52, 45);
      }, 950));

      sequenceTimers.push(setTimeout(() => {
        playSparkleChime();
        spawnSparkleBurst(W * 0.5, H * 0.48, 60);
      }, 2000));

      sequenceTimers.push(setTimeout(() => {
        showEnvelopeOnBouquet();
      }, 2900));
    }

    function showEnvelopeOnBouquet() {
      envelopeCard.classList.remove('opacity-0', 'pointer-events-none');
      envelopeCard.classList.add('opacity-100', 'pointer-events-auto');
      envelopeCard.style.transform = 'translate(-50%, -50%) scale(1) rotate(-1.5deg)';
    }

    function openVintageLetter(e) {
      if (e) e.stopPropagation();
      playSparkleChime();
      spawnSparkleBurst(W * 0.5, H * 0.5, 35);

      letterBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      letterBackdrop.classList.add('opacity-100', 'pointer-events-auto');
      vintageLetterModal.classList.remove('scale-75');
      vintageLetterModal.classList.add('scale-100');

      startTypewriterLetter();
    }

    envelopeCard.addEventListener('click', openVintageLetter);
    envelopeCard.addEventListener('keydown', (e) => {
      if(e.key==='Enter'||e.key===' ') { e.preventDefault();openVintageLetter(e); }
    });
    envelopeCard.addEventListener('touchend', (e) => {
      e.preventDefault();
      openVintageLetter(e);
    });

    function startTypewriterLetter() {
      if (typewriterTimer) clearTimeout(typewriterTimer);
      letterHeading.innerHTML = letterTitleHTML;
      letterBody.innerHTML = '';

      let pIdx = 0;
      let cIdx = 0;
      let pElem = null;

      function typeStep() {
        if (pIdx >= letterParagraphs.length) {
          return;
        }
        if (cIdx === 0) {
          pElem = document.createElement('p');
          letterBody.appendChild(pElem);
        }
        const text = letterParagraphs[pIdx];
        cIdx += 2;
        pElem.textContent = text.slice(0, cIdx);

        if (cIdx >= text.length) {
          pIdx++;
          cIdx = 0;
          typewriterTimer = setTimeout(typeStep, 180);
        } else {
          typewriterTimer = setTimeout(typeStep, 20);
        }
      }
      typeStep();
    }

    function closeVintageLetter(e) {
      if (e) e.stopPropagation();
      if (typewriterTimer) clearTimeout(typewriterTimer);
      playSparkleChime();
      spawnSparkleBurst(W * 0.5, H * 0.52, 35);

      letterBackdrop.classList.remove('opacity-100', 'pointer-events-auto');
      letterBackdrop.classList.add('opacity-0', 'pointer-events-none');
      vintageLetterModal.classList.remove('scale-100');
      vintageLetterModal.classList.add('scale-75');

      // Ẩn hoàn toàn phong thư nhỏ trên bó hoa khi bấm đóng thư
      envelopeCard.classList.remove('opacity-100', 'pointer-events-auto');
      envelopeCard.classList.add('opacity-0', 'pointer-events-none');
      envelopeCard.style.display = 'none';
    }

    document.getElementById('btnCloseLetter').addEventListener('click', closeVintageLetter);

    const btnSound = document.getElementById('btnSoundToggle');
    if (btnSound) {
      btnSound.addEventListener('click', toggleSound);
    }

    // Tap/Click anywhere on sky/canvas to create celestial fairy dust bursts
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#btnHold, #btnSoundToggle, #vintageLetterModal, #btnCloseLetter')) return;
      spawnSparkleBurst(e.clientX, e.clientY, 16);
      if (Math.random() < 0.35) playSparkleChime();
    });

    window.addEventListener('resize', initScene);
    window.onload = () => {
      initScene();
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
